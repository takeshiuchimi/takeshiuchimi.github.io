<style>
/* =============================================
   TakeshiUchimi Projects · デザイントークン
   こもれび基準：生成り・淡い茶・くすみ緑
   ============================================= */
:root{
  --bg:#f2e8d5;--bg2:#fbf6eb;--bg3:#f6eedf;--bg4:#eee1ca;
  --gold:#ad8a54;--gold2:#c5a66f;--gold-dim:rgba(173,138,84,0.12);
  --red:#b77a72;--red2:#c98f86;
  --text:#3b2e22;--text2:#5c4a38;
  --muted:#8e8375;--muted2:#7c756b;
  --border:#d8c9b0;--border2:#cdbb9f;
  --moss:#7c8b5d;--moss-deep:#5f6e45;
  --overlay:rgba(59,46,34,.48);
  --radius:12px;
}
html.dark-mode{
  /* ニャーズ基準 */
  --bg:#181410;
  --bg2:#3d342a;
  --bg3:#241e18;
  --bg4:#2f2821;

  --gold:#E0BC4A;
  --gold2:#E8CA68;
  --gold-dim:rgba(224,188,74,.14);

  --red:#D9622B;
  --red2:#F2874A;

  --text:#EFE6D6;
  --text2:#D8CCBA;

  --muted:#8f806d;
  --muted2:#B8A68E;

  --border:#4d4034;
  --border2:#625141;

  --moss:#8fb56e;
  --moss-deep:#a8d488;

  --overlay:rgba(20,16,12,.80);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(124,139,93,.08), transparent 32%),
    radial-gradient(circle at 88% 82%, rgba(183,122,114,.08), transparent 34%),
    var(--bg);
  color:var(--text);font-family:'Noto Serif JP',serif;
  min-height:100vh;display:flex;flex-direction:column;
}

/* HEADER */
header{
  padding:24px 18px 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(251,246,235,.96),rgba(242,232,213,.88));
  transition:background .3s,color .3s,border-color .3s;
}
html.dark-mode header{
  background:linear-gradient(180deg,#181410,#241e18);
}
.brand-wrap{
  max-width:480px;margin:0 auto;
}
.brand-grid{
  display:grid;
  grid-template-columns:46px 1fr auto;
  grid-template-rows:auto auto;
  column-gap:11px;
  align-items:center;
}
.brand-cat{
  grid-column:1;grid-row:1 / 3;
  width:42px;height:50px;display:block;
}
.brand-cat svg{width:100%;height:100%;display:block;}
.brand-top{
  grid-column:2;grid-row:1;
  font-family:'Oswald',sans-serif;
  font-size:11px;letter-spacing:2.7px;
  color:var(--moss-deep);
  line-height:1.2;
  white-space:nowrap;
}
.brand-sub{
  grid-column:2 / 4;grid-row:2;
  font-size:18px;font-weight:700;
  color:var(--text);
  letter-spacing:.08em;
  line-height:1.25;
  margin-top:4px;
}
.theme-btn{
  grid-column:3;grid-row:1;
  border:1px solid rgba(124,139,93,.32);
  background:rgba(124,139,93,.10);
  color:var(--moss-deep);
  border-radius:999px;
  padding:6px 10px;
  font-family:'Noto Serif JP',serif;
  font-size:10px;
  cursor:pointer;
  white-space:nowrap;
}
.theme-btn:hover{background:rgba(124,139,93,.18);}
.util-btn{
  border:none;
  background:var(--moss);
  color:var(--bg2);
  padding:7px 16px;
  border-radius:999px;
  font-family:'Noto Serif JP',serif;
  font-size:11px;
  letter-spacing:.04em;
  cursor:pointer;
  box-shadow:0 2px 0 var(--moss-deep);
}
.util-btn:active{transform:translateY(2px);box-shadow:none;}
/* MODAL */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:22px;
  background:var(--overlay);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-card{
  position:relative;
  width:min(100%,430px);
  max-height:78vh;overflow:auto;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:26px 22px 22px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45);
  transform:translateY(10px);
  transition:transform .22s ease,background .3s,color .3s;
}
.modal-overlay.open .modal-card{transform:translateY(0);}
.modal-close{
  position:absolute;top:8px;right:10px;
  width:30px;height:30px;border:none;background:transparent;
  color:var(--text2);font-size:21px;cursor:pointer;
}
.modal-title{
  font-size:18px;font-weight:700;color:var(--text);
  text-align:center;margin-bottom:14px;letter-spacing:.08em;
}
.modal-body{font-size:12.5px;line-height:1.9;color:var(--text2);}
.modal-body p{margin:0 0 11px;}
.modal-body p:last-child{margin-bottom:0;}

/* MAIN */
main{max-width:480px;margin:0 auto;width:100%;padding:22px 16px 8px;}
.section-label{font-size:10px;letter-spacing:4px;color:var(--muted2);text-transform:uppercase;margin-bottom:16px;padding-left:4px;}

/* PROJECT CARD */
.project{
  display:flex;align-items:center;gap:16px;
  background:rgba(251,246,235,.92);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:12px;
  text-decoration:none;color:inherit;
  transition:all 0.2s;position:relative;overflow:hidden;cursor:pointer;
}
.project::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--moss),var(--gold));
  border-radius:3px 0 0 3px;opacity:0;transition:opacity 0.2s;
}
.project:hover{border-color:rgba(124,139,93,.45);transform:translateX(4px);background:var(--bg3);box-shadow:0 8px 24px rgba(74,52,35,.08);}
.project:hover::before{opacity:1;}
.proj-icon{font-size:28px;flex-shrink:0;width:48px;height:48px;background:var(--bg4);border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
.proj-info{flex:1;min-width:0;}
.proj-num{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:var(--muted2);margin-bottom:3px;}
.proj-name{font-size:15px;font-weight:700;color:var(--text);}
.proj-desc{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.6;}
.proj-badge{flex-shrink:0;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:20px;font-family:'Oswald',sans-serif;text-transform:uppercase;}
.badge-live{background:rgba(124,139,93,.10);color:var(--moss-deep);border:1px solid rgba(124,139,93,.30);}
.proj-arrow{color:var(--moss-deep);font-size:18px;flex-shrink:0;opacity:0;transition:opacity 0.2s;}
.project:hover .proj-arrow{opacity:1;}

/* FOOTER */
footer{
  text-align:center;
  padding:18px 20px 38px;
  font-size:10px;color:var(--muted);
  letter-spacing:1px;line-height:2;
}
footer em{color:var(--moss-deep);font-style:normal;}

body,.project,.proj-icon,footer{transition:background .3s,color .3s,border-color .3s;}
header{padding:16px 16px 12px;}
.brand-wrap{max-width:480px;margin:0 auto;}
.compact-head{
  grid-template-columns:42px 1fr 34px;

  column-gap:9px;

.brand-cat{
  grid-column:1;grid-row:1 / 3;
  width:38px;height:44px;
  align-self:center;
  text-decoration:none;
}
.brand-cat:hover{transform:translateY(-1px);}
.brand-top{
  grid-column:2;grid-row:1;
  font-size:10.5px;letter-spacing:2px;
  line-height:18px;
}
.brand-sub{
  grid-column:2 / 4;grid-row:2;
  font-size:16px;line-height:22px;margin:0;
}
.icon-theme{
  grid-column:3;grid-row:1;
  width:30px;height:30px;padding:0;
  display:flex;align-items:center;justify-content:center;
  align-self:start;
  margin-top:-6px;
  font-size:15px;
}
main{padding-top:22px;}
.bottom-tools{
  display:flex;justify-content:center;gap:8px;
  margin:18px 0 6px;
}
.bottom-tools .util-btn{padding:6px 14px;font-size:10.5px;}

footer{padding:4px 20px 18px;}
.modal-home-qr{
  margin-top:16px;
  padding-top:14px;
  border-top:1px dashed var(--border);
  text-align:center;
}
.modal-home-qr img{

  width:min(190px,55vw);
  height:auto;
  margin:0 auto;
  padding:8px;
  background:#fff;
  border-radius:8px;
}
.modal-home-qr div{
  margin-top:7px;
  font-family:'Oswald',sans-serif;
  font-size:9px;
  letter-spacing:.04em;
  color:var(--muted2);
  word-break:break-all;
}
html.dark-mode body{
  background:

html.dark-mode .project{

html.dark-mode .project:hover{

html.dark-mode .proj-icon{
  background:var(--bg4);
  border-color:var(--border);
  box-shadow:none;
}
html.dark-mode .modal-card{
  background:var(--bg2);
  border-color:var(--border);
}
html.dark-mode .util-btn{
  background:#6b5236;
  color:#fff;
  box-shadow:0 2px 0 #8B6F47;
}
html.dark-mode .icon-theme{
  background:#6b5236;
  color:#fff;
  border-color:#8B6F47;
}
html.dark-mode .badge-live{
  background:rgba(143,181,110,.12);
  color:var(--moss-deep);
  border-color:rgba(143,181,110,.32);
}
</style>

  const SITE_DATA = JSON.parse(document.getElementById('siteData').textContent);

  const projectList = document.getElementById('projectList');
  projectList.innerHTML = SITE_DATA.projects.map(p => `
    <a class="project" href="${p.url}">
      <div class="proj-icon">${p.icon}</div>

  `).join('');

  const renderParagraphs = paras =>
    paras.map(p => `<p>${p}</p>`).join('');

  document.getElementById('messageTitle').textContent = SITE_DATA.message.title;
  document.getElementById('messageBody').innerHTML =
    renderParagraphs(SITE_DATA.message.paragraphs) +
    `<div class="modal-home-qr">
      <img src="${SITE_DATA.message.qrDataUri}" alt="${SITE_DATA.message.homeUrl} QRコード">
      <div>${SITE_DATA.message.homeUrl}</div>
    </div>`;

  document.getElementById('techTitle').textContent = SITE_DATA.techInfo.title;
  document.getElementById('techBody').innerHTML =
    renderParagraphs(SITE_DATA.techInfo.paragraphs);

  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const saved = localStorage.getItem('takeshi_theme');
  if(saved === 'dark') root.classList.add('dark-mode');

  const syncThemeLabel = () => {
    const isDark = root.classList.contains('dark-mode');
    themeBtn.textContent = isDark ? '☀' : '◐';
    themeBtn.setAttribute('aria-label', isDark ? 'ライトモードに切替' : 'ダークモードに切替');
    themeBtn.setAttribute('title', isDark ? 'ライトモードに切替' : 'ダークモードに切替');
  };
  syncThemeLabel();

  themeBtn.addEventListener('click', () => {
    root.classList.toggle('dark-mode');
    localStorage.setItem(
      'takeshi_theme',
      root.classList.contains('dark-mode') ? 'dark' : 'light'
    );
    syncThemeLabel();
  });

  document.querySelectorAll('[data-modal]').forEach(btn => {
    btn.addEventListener('click', () => {
      const modal = document.getElementById(btn.dataset.modal);
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
    });
  });

  document.querySelectorAll('.modal-overlay').forEach(modal => {
    const close = () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
    };
    modal.addEventListener('click', e => {
      if(e.target === modal) close();
    });
    modal.querySelector('.modal-close').addEventListener('click', close);
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      document.querySelectorAll('.modal-overlay.open').forEach(m => {
        m.classList.remove('open');
        m.setAttribute('aria-hidden','true');
      });
    }
  });
})();
</script>

</body>
</html>
