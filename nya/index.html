/* ============================================================
   ニャモリー(神経衰弱) ゲームモジュール
   カードの模様はサイコロ目(1〜6)を流用。この模様は180度回転
   させても同じ形に見えるため、1つの共有盤をそのまま両側から
   正しく読める(特別な反転描画が不要)。
   ============================================================ */
(function(){

const boardHtml = `
  <div class="turn-badge top" id="nmemTurnTop">後手</div>
  <div class="status-bar top" id="nmemStatusTop">
    <span id="nmemLabelTop">CPU</span>
    <span>score <b id="nmemScoreTop">0</b></span>
  </div>
  <div class="nmem-board" id="nmemBoard"></div>
  <div class="status-bar" id="nmemStatusBottom">
    <span id="nmemLabelBottom">あなた</span>
    <span>score <b id="nmemScoreBottom">0</b></span>
  </div>
  <div class="turn-badge bottom" id="nmemTurnBottom">先手</div>
`;

const COLS = 4, ROWS = 3;
const CARD_BACK_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="58" r="30" fill="var(--brown)"/>
  <path d="M26 34 L36 56 L20 56 Z" fill="var(--brown)"/>
  <path d="M74 34 L80 56 L64 56 Z" fill="var(--brown)"/>
  <circle cx="40" cy="56" r="3.2" fill="var(--cream)"/>
  <circle cx="60" cy="56" r="3.2" fill="var(--cream)"/>
  <path d="M45 66 Q50 70 55 66" stroke="var(--cream)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;

function makeDeck(){
  const values = [];
  for(let v=1;v<=6;v++){ values.push(v,v); }
  for(let i=values.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [values[i],values[j]]=[values[j],values[i]];
  }
  return values.map(v=>({ value:v, revealed:false, matched:false }));
}

let deck, turn, gameOver, winner, score, flippedIdx, cpuMemory, cpuThinking;
let boardEl, cellEls, scoreTopEl, scoreBottomEl, labelTopEl, labelBottomEl, turnTopEl, turnBottomEl;

function isInteractionAllowed(){
  return checkInteractionAllowed(turn, gameOver, turn, cpuThinking);
}

function render(){
  deck.forEach((card, i)=>{
    const el = cellEls[i];
    if(card.matched){
      el.className = 'nmem-cell matched';
      el.innerHTML = '';
    }else if(card.revealed){
      el.className = 'nmem-cell revealed';
      el.innerHTML = pipGridSvg(card.value);
    }else{
      el.className = 'nmem-cell';
      el.innerHTML = CARD_BACK_SVG;
    }
  });
  scoreTopEl.textContent = score.cpu;
  scoreBottomEl.textContent = score.player;
  labelTopEl.textContent = mode==='pvp' ? 'プレイヤー2' : 'CPU';
  labelBottomEl.textContent = mode==='pvp' ? 'プレイヤー1' : 'あなた';
  const topActive = !gameOver && turn==='cpu';
  const bottomActive = !gameOver && turn==='player';
  renderTurnBadges(turnTopEl, turnBottomEl, topActive, bottomActive, cpuThinking);
}

function onCardTap(i){
  if(!isInteractionAllowed()){ feedbackInvalid(); return; }
  const card = deck[i];
  if(card.matched || card.revealed) return;
  if(flippedIdx.length>=2) return;
  card.revealed = true;
  flippedIdx.push(i);
  render();
  if(flippedIdx.length===2) setTimeout(resolveFlip, 550);
}

function resolveFlip(){
  const [a,b] = flippedIdx;
  const cardA = deck[a], cardB = deck[b];
  const ownerLabel = turn;
  if(cardA.value===cardB.value){
    cardA.matched = true; cardB.matched = true;
    score[ownerLabel] += 1;
    flippedIdx = [];
    render();
    checkGameEnd();
    if(!gameOver && mode==='cpu' && turn==='cpu'){
      cpuThinking = true; render();
      setTimeout(cpuTakeTurn, 500);
    }
  }else{
    cardA.revealed = false; cardB.revealed = false;
    flippedIdx = [];
    turn = turn==='player' ? 'cpu' : 'player';
    render();
    if(mode==='cpu' && turn==='cpu'){
      cpuThinking = true; render();
      setTimeout(cpuTakeTurn, 500);
    }
  }
}

function checkGameEnd(){
  if(deck.every(c=>c.matched)){
    gameOver = true;
    if(score.player>score.cpu) winner='player';
    else if(score.cpu>score.player) winner='cpu';
    else winner='draw';
    setTimeout(()=> showResult(winner), 200);
  }
}

function cpuTakeTurn(){
  cpuThinking = false;
  if(gameOver) return;
  // 既知のペアがあれば狙う。無ければ未知のカードからランダムに1枚
  const knownPairs = {};
  cpuMemory.forEach((v,i)=>{
    if(v==null || deck[i].matched) return;
    if(!knownPairs[v]) knownPairs[v] = [];
    knownPairs[v].push(i);
  });
  let pickA=null, pickB=null;
  for(const v in knownPairs){
    if(knownPairs[v].length>=2){ pickA=knownPairs[v][0]; pickB=knownPairs[v][1]; break; }
  }
  if(pickA==null){
    const unknownIdx = deck.map((c,i)=>i).filter(i=>!deck[i].matched && cpuMemory[i]==null);
    const knownIdx = deck.map((c,i)=>i).filter(i=>!deck[i].matched && cpuMemory[i]!=null);
    pickA = unknownIdx.length>0 ? unknownIdx[Math.floor(Math.random()*unknownIdx.length)] : knownIdx[0];
  }
  revealForCpu(pickA);
  setTimeout(()=>{
    if(pickB==null){
      const remaining = deck.map((c,i)=>i).filter(i=>!deck[i].matched && i!==pickA);
      const matchIdx = remaining.find(i=> cpuMemory[i]===deck[pickA].value);
      const unknownIdx2 = remaining.filter(i=>cpuMemory[i]==null);
      pickB = matchIdx!==undefined ? matchIdx : (unknownIdx2.length>0 ? unknownIdx2[Math.floor(Math.random()*unknownIdx2.length)] : remaining[0]);
    }
    revealForCpu(pickB);
    setTimeout(resolveFlip, 550);
  }, 550);
}
function revealForCpu(i){
  deck[i].revealed = true;
  cpuMemory[i] = deck[i].value;
  flippedIdx.push(i);
  render();
}

function onReveal(i){
  cpuMemory[i] = deck[i].value;
}

function init(selectedMode){
  boardEl = document.getElementById('nmemBoard');
  scoreTopEl = document.getElementById('nmemScoreTop');
  scoreBottomEl = document.getElementById('nmemScoreBottom');
  labelTopEl = document.getElementById('nmemLabelTop');
  labelBottomEl = document.getElementById('nmemLabelBottom');
  turnTopEl = document.getElementById('nmemTurnTop');
  turnBottomEl = document.getElementById('nmemTurnBottom');

  boardEl.innerHTML = '';
  cellEls = [];
  deck = makeDeck();
  for(let i=0;i<deck.length;i++){
    const d = document.createElement('div');
    d.className = 'nmem-cell';
    d.innerHTML = CARD_BACK_SVG;
    d.addEventListener('click', ()=>onCardTap(i));
    boardEl.appendChild(d);
    cellEls.push(d);
  }
  turn = 'player';
  gameOver = false;
  winner = null;
  score = { player:0, cpu:0 };
  flippedIdx = [];
  cpuMemory = new Array(deck.length).fill(null);
  cpuThinking = false;
  render();
}

function getResultMessageCpu(resultKind){
  if(resultKind==='draw') return `🤝 引き分け! (${score.player} - ${score.cpu})`;
  return resultKind==='player' ? `🎉 あなたの勝ち! (${score.player} - ${score.cpu})` : `🐾 CPUの勝ち… (${score.player} - ${score.cpu})`;
}
function getResultMessagePvp(resultKind){
  if(resultKind==='draw') return `🤝 引き分け! (${score.player} - ${score.cpu})`;
  return (resultKind==='player' ? 'プレイヤー1' : 'プレイヤー2') + ` の勝ち! (${score.player} - ${score.cpu})`;
}

const howToPlayHtml = buildHowToPlayHtml({
  rules: '4×3マスの神経衰弱。同じ目の札を2枚めくって揃えたら、その札をもらえて、もう一度自分の番になります。揃わなければ相手の番に。全部のペアが無くなった時点で、多く取った方が勝ちです。',

const cardIconCpu = cardIconPlayer;

registerGame('nyamemory', {

  emoji: '🀄',
  cardIconPlayer,
  cardIconCpu,
  title: 'ニャモリー',
  desc: '4×3マスの神経衰弱。同じ目の札を2枚揃えたらもらえて、もう一度自分の番。揃わなければ相手の番です。多く取った方が勝ち!',
  boardHtml,

  getResultMessageCpu,

  _test: {
    getDeck: ()=>deck,

})();

/* ============================================================
   ニャーロク: すごろく形式。長期決戦タイプとして設計したが、実際は短期決戦寄りのテンポに。
   WheelPickerを、サイコロの目を出す用途と、着地したマスの
   イベント文を表示する用途の両方に使い回す。
   ============================================================ */
(function(){

const TRACK_LENGTH = 24; // マスの総数(0スタート)
const GOAL_INDEX = TRACK_LENGTH - 1; // 「24」のマス自体がゴール
const EVENTS = {
  4:  { text: '日向ぼっこが気持ちよくて2マス進む!', apply: (pos)=> pos+2 },
  8:  { text: '毛づくろいに夢中で1回休み', apply: (pos, ctx)=>{ ctx.skipNext = true; return pos; } },
  12: { text: '毛玉を吐いて3マス戻る…', apply: (pos)=> Math.max(0, pos-3) },
  16: { text: 'またたびで大興奮!もう一度サイコロ', apply: (pos, ctx)=>{ ctx.rollAgain = true; return pos; } },
  20: { text: '取っ組み合いになって場所を入れ替わる!', apply: (pos, ctx)=>{ const opp = ctx.getOpponentPos(); ctx.setOpponentPos(ctx.myPos); return opp; } },
};
const ROWS = 4, COLS = 6; // 24マスを4行6列の蛇行(スネーク)配置で表示

function cellRC(idx){
  const row = Math.floor(idx / COLS);
  let col = idx % COLS;
  if(row % 2 === 1) col = COLS - 1 - col; // 奇数行は逆順(スネーク)
  return { row, col };
}

let boardEl, cellEls, wheelTopEl, wheelBottomEl, rollBtnTop, rollBtnBottom;
let previewTopEl, previewBottomEl, previewTimer, previewMarqueeInterval;
let wpTop, wpBottom;
let pos, turn, gameOver, winner, skipNext, cpuThinking;
let turnTopEl, turnBottomEl;

function isInteractionAllowed(owner){
  return checkInteractionAllowed(owner, gameOver, turn, cpuThinking);
}

function showEventPreview(idx){
  const ev = EVENTS[idx];
  if(!ev) return;
  runPreviewTicker(ev.text, 5200);
}

function runPreviewTicker(text, showDuration){
  clearTimeout(previewTimer);
  clearInterval(previewMarqueeInterval);
  [previewTopEl, previewBottomEl].forEach(el=>{
    el.style.whiteSpace = 'nowrap';
    el.style.overflow = 'hidden';
    el.style.textOverflow = 'clip';
    el.style.display = 'block';
  });
  const WINDOW = 14; // 一度に見せる文字数
  const padded = text + '　　　　　　' + text; // 1周分の余白+繰り返しでループ感を出す
  let offset = 0;
  function tick(){
    const slice = padded.slice(offset, offset + WINDOW);
    previewTopEl.textContent = slice;
    previewBottomEl.textContent = slice;
    offset = (offset + 1) % text.length;
  }
  tick();
  previewMarqueeInterval = setInterval(tick, 260);
  previewTopEl.classList.add('show');
  previewBottomEl.classList.add('show');
  previewTimer = setTimeout(()=>{
    clearInterval(previewMarqueeInterval);
    previewTopEl.classList.remove('show');
    previewBottomEl.classList.remove('show');
  }, showDuration);
}

function renderBoard(){
  for(let i=0;i<TRACK_LENGTH;i++){
    const el = cellEls[i];
    const isEvent = !!EVENTS[i];
    const hasPlayer = pos.player === i;
    const hasCpu = pos.cpu === i;
    const isStart = i===0;
    const isGoal = i===GOAL_INDEX;
    el.className = 'nsei-cell' + (isEvent ? ' event' : '') + (isGoal ? ' goal-cell' : '') + (isStart ? ' start-cell' : '');
    if(isStart){
      el.innerHTML = `<span class="nsei-label-big center">S</span>`;
    }else if(isGoal){
      el.innerHTML = `<span class="nsei-label-big near">G</span><span class="nsei-label-big far">G</span>`;
    }else{
      const {row} = cellRC(i);
      const isRowEnd = (i % COLS) === COLS - 1;
      const arrow = isRowEnd ? '↓' : (row % 2 === 0 ? '→' : '←');
      el.innerHTML = `<span class="nsei-num near">${i+1}</span><span class="nsei-num far">${i+1}</span><span class="nsei-arrow">${arrow}</span>`;
    }
    if(hasPlayer){
      const t = document.createElement('div');
      t.className = 'nsei-token player';
      t.innerHTML = pawSvg('player');
      el.appendChild(t);
    }
    if(hasCpu){
      const t = document.createElement('div');
      t.className = 'nsei-token cpu';
      t.innerHTML = pawSvg('cpu');
      el.appendChild(t);
    }
  }

  const topActive = !gameOver && turn==='cpu';
  const bottomActive = !gameOver && turn==='player';
  renderTurnBadges(turnTopEl, turnBottomEl, topActive, bottomActive, cpuThinking);

  wpTop.setDisabled(!isInteractionAllowed('cpu'));
  wpBottom.setDisabled(!isInteractionAllowed('player'));
  rollBtnTop.disabled = !isInteractionAllowed('cpu');
  rollBtnBottom.disabled = !isInteractionAllowed('player');
}

function moveContextFor(owner){
  return {
    myPos: pos[owner],
    getOpponentPos: ()=> owner==='player' ? pos.cpu : pos.player,
    setOpponentPos: (v)=>{ if(owner==='player') pos.cpu = v; else pos.player = v; },
    skipNext: false, rollAgain: false,
  };
}

function applyRoll(owner, roll, wp){
  const startPos = pos[owner];
  const targetPos = Math.min(GOAL_INDEX, startPos + roll);
  animateSteps(owner, startPos, targetPos, ()=> resolveLanding(owner, targetPos, wp));
}

function animateSteps(owner, from, to, onDone){
  let current = from;
  function stepOnce(){
    if(current >= to){ onDone(); return; }
    current++;
    pos[owner] = current;
    renderBoard();
    feedbackTap();
    setTimeout(stepOnce, 350);
  }
  stepOnce();
}

function resolveLanding(owner, newPos, wp){
  if(newPos >= GOAL_INDEX){
    gameOver = true; winner = owner;
    renderBoard();
    const goalCellEl = cellEls[GOAL_INDEX];
    const tokenEl = goalCellEl.querySelectorAll ? goalCellEl.querySelectorAll('.nsei-token.' + owner)[0] : null;
    if(tokenEl) tokenEl.classList.add('nsei-blink');
    setTimeout(()=> showResult(winner), 1900);
    return;
  }

  const ev = EVENTS[newPos];
  if(ev){
    setTimeout(()=>{
      const ctx = moveContextFor(owner);
      const resultPos = ev.apply(pos[owner], ctx);
      pos[owner] = Math.max(0, Math.min(GOAL_INDEX, resultPos));
      skipNext = ctx.skipNext ? owner : null;
      runPreviewTicker(ev.text, 1400);
      renderBoard();
      if(pos[owner] >= GOAL_INDEX){
        gameOver = true; winner = owner;
        renderBoard();
        setTimeout(()=> showResult(winner), 600);
        return;
      }
      setTimeout(()=>{
        if(ctx.rollAgain){
          renderBoard();
          if(owner==='cpu') setTimeout(cpuTakeTurn, 500);
        }else{
          endTurn();
        }
      }, 1200);
    }, 250);
  }else{
    setTimeout(endTurn, 250);
  }
}

function endTurn(){
  const next = turn==='player' ? 'cpu' : 'player';
  if(skipNext===next){
    skipNext = null;
    turn = next;
    renderBoard();
    setTimeout(endTurn, 500);
    return;
  }
  turn = next;
  renderBoard();
  if(mode==='cpu' && turn==='cpu') setTimeout(cpuTakeTurn, 500);
}

function doRoll(owner, wp){
  if(!isInteractionAllowed(owner)) { feedbackInvalid(); return; }
  wp.setDisabled(true);
  wp.spinRandom(2, 3);
}

function cpuTakeTurn(){
  if(gameOver) return;
  cpuThinking = true;
  renderBoard();
  setTimeout(()=>{
    cpuThinking = false;
    wpTop.setDisabled(true);
    wpTop.spinRandom(2, 3);
  }, 400);
}

function init(selectedMode){
  boardEl = document.getElementById('nseiBoard');
  wheelTopEl = document.getElementById('nseiWheelTop');
  wheelBottomEl = document.getElementById('nseiWheelBottom');
  rollBtnTop = document.getElementById('nseiRollTop');
  rollBtnBottom = document.getElementById('nseiRollBottom');
  turnTopEl = document.getElementById('nseiTurnTop');
  turnBottomEl = document.getElementById('nseiTurnBottom');

  boardEl.innerHTML = '';
  cellEls = [];
  previewTopEl = document.getElementById('nseiPreviewTop');
  previewBottomEl = document.getElementById('nseiPreviewBottom');
  for(let i=0;i<TRACK_LENGTH;i++){
    const {row,col} = cellRC(i);
    const el = document.createElement('div');
    el.className = 'nsei-cell';
    el.style.gridRow = (row+1);
    el.style.gridColumn = (col+1);
    el.addEventListener('click', ()=> showEventPreview(i));
    boardEl.appendChild(el);
    cellEls.push(el);
  }

  pos = { player:0, cpu:0 };
  turn = 'player';
  gameOver = false;
  winner = null;
  skipNext = null;
  cpuThinking = false;

  if(wpTop) wpTop.destroy();
  if(wpBottom) wpBottom.destroy();
  let topReady = false, bottomReady = false;
  let suppressTop = false, suppressBottom = false;
  wpTop = new WheelPicker(wheelTopEl, {
    items:[1,2,3,4,5,6], itemHeight:36, visibleCount:1,
    renderItem: (item)=> typeof item==='number' ? { html: pipGridSvg(item) } : { text: item },
    onChange: (val, idx)=>{
      if(!topReady){ topReady = true; return; }
      if(suppressTop){ suppressTop = false; return; }
      if(typeof val==='number' && !gameOver){
        wpTop.setDisabled(true);
        applyRoll('cpu', val, wpTop);
      }
    }
  });
  wpBottom = new WheelPicker(wheelBottomEl, {
    items:[1,2,3,4,5,6], itemHeight:36, visibleCount:1,
    renderItem: (item)=> typeof item==='number' ? { html: pipGridSvg(item) } : { text: item },
    onChange: (val, idx)=>{
      if(!bottomReady){ bottomReady = true; return; }
      if(suppressBottom){ suppressBottom = false; return; }
      if(typeof val==='number' && !gameOver){
        wpBottom.setDisabled(true);
        applyRoll('player', val, wpBottom);
      }
    }
  });

  wpTop._suppressNext = ()=>{ suppressTop = true; };
  wpBottom._suppressNext = ()=>{ suppressBottom = true; };

  rollBtnTop.addEventListener('click', ()=> doRoll('cpu', wpTop));
  rollBtnBottom.addEventListener('click', ()=> doRoll('player', wpBottom));

  renderBoard();
}

function getResultMessageCpu(resultKind){
  return resultKind==='player' ? '🎉 あなたの勝ち! ゴール到達!' : '🐾 CPUの勝ち… 先にゴールされました';
}
function getResultMessagePvp(resultKind){
  return (resultKind==='player' ? 'プレイヤー1' : 'プレイヤー2') + ' の勝ち! ゴール到達!';
}

/* ============================================================
   ニャーホッケー: 対戦ポン。じゃれ合いタイプ(リアルタイム・ラリー)。
   7点先取で勝敗... の予定だったが、テストの結果5点先取に調整。パドルはドラッグで操作。
   ============================================================ */
(function(){

const FIELD_W = 100, FIELD_H = 150;
const PADDLE_W = 32, PADDLE_H = 5;
const PADDLE_Y_TOP = 10, PADDLE_Y_BOTTOM = FIELD_H - 10;
const PLAYER_Y_MIN = FIELD_H * 0.54; // 前進できる限界(中央付近まで)
const CPU_Y_MAX = FIELD_H * 0.46;
const BALL_R = 3;
const MAX_BALL_SPEED = 9;
const WIN_SCORE = 5;
const GOAL_W = 40; // 世間の相場は25〜33%程度だが、あえて40%に(守りやすいがゼロではない)
const GOAL_LEFT = (FIELD_W - GOAL_W) / 2;
const GOAL_RIGHT = (FIELD_W + GOAL_W) / 2;

const boardHtml = `
  <div class="status-bar top" id="nyponStatusTop">
    <span id="nyponLabelTop">CPU</span>
    <span>score <b id="nyponScoreTop">0</b></span>
  </div>
  <div class="nypon-field" id="nyponField">
    <div class="nypon-wall top left"></div>
    <div class="nypon-wall top right"></div>
    <div class="nypon-goal-mark top"></div>
    <div class="nypon-wall bottom left"></div>
    <div class="nypon-wall bottom right"></div>
    <div class="nypon-goal-mark bottom"></div>
    <div class="nypon-center-line"></div>
    <div class="nypon-center-circle"></div>
    <div class="nypon-paw top" id="nyponPawTop"></div>
    <div class="nypon-paddle top" id="nyponPaddleTop"></div>
    <div class="nypon-ball" id="nyponBall"></div>
    <div class="nypon-paddle bottom" id="nyponPaddleBottom"></div>
    <div class="nypon-paw bottom" id="nyponPawBottom"></div>
    <div class="nypon-callout" id="nyponCallout"></div>
  </div>
  <div class="status-bar" id="nyponStatusBottom">
    <span id="nyponLabelBottom">あなた</span>
    <span>score <b id="nyponScoreBottom">0</b></span>
  </div>
`;

let fieldEl, ballEl, paddleTopEl, paddleBottomEl, pawTopEl, pawBottomEl;
let ball, playerPaddleX, cpuPaddleX, playerPaddleY, cpuPaddleY, score, gameOver, winner;
let playerTargetX, playerTargetY, cpuTargetX, cpuTargetY;
let prevPlayerPaddleX, prevCpuPaddleX, cpuHoldTicks;
let playerLunge = 0, cpuLunge = 0;

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function moveToward(current, target, speed){
  if(target === undefined) return current;
  if(current < target) return Math.min(target, current + speed);
  if(current > target) return Math.max(target, current - speed);
  return current;
}

function resetBall(heldBy){
  ball = {
    x: heldBy==='player' ? playerPaddleX : cpuPaddleX,
    y: heldBy==='player' ? playerPaddleY - BALL_R - 1 : cpuPaddleY + BALL_R + 1,
    vx: 0, vy: 0,
    held: heldBy,
  };
  cpuHoldTicks = 0;
}

const FACEOFF_WAIT_TICKS = 60; // 3秒(50ms*60) = 「3」「2」「1」の掛け声用
const FACEOFF_CIRCLE_R = 11; // センターサークルの半径(CSSのwidth:22%と対応)

function startFaceoff(){
  ball = { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, held: null, faceoff: true, pending: true };
  faceoffCountdown = FACEOFF_WAIT_TICKS;
  cpuFaceoffDelay = Math.floor(Math.random() * 8); // 審判の笛のタイミングのようにブレを持たせる
  showCallout('3', 700);
}

function releaseBall(flickVx, flickVy){
  if(!ball || !ball.held) return;
  const dir = ball.held==='player' ? -1 : 1;
  if(flickVx !== undefined){
    const power = clamp(Math.abs(flickVy) * 0.9, 3.2, 8);
    ball.vy = dir * power;
    ball.vx = clamp(flickVx * 0.9, -6, 6);
    if(ball.held==='player') playerLunge = 1; else cpuLunge = 1;
  }else{
    ball.vy = dir * 4.2;
    ball.vx = (Math.random()*2-1) * 1.0;
  }
  ball.held = null;
}

function scorePoint(owner){
  score[owner]++;
  showCallout('ゴーーール!', 1200);
  render();
  if(score[owner] >= WIN_SCORE){
    gameOver = true; winner = owner;
    stopEngineLoop();
    setTimeout(()=> showCallout('ゲームセット!', 1400), 1200);
    setTimeout(()=> showResult(winner), 2600);
    return;
  }
  resetBall(owner==='player' ? 'cpu' : 'player');
}

let cpuShotPlan = null;
let cpuFaceoffDelay = 0;
let faceoffCountdown = 0;
let cpuLastBallVy = 0;

function tick(){
  if(gameOver) return;

  const playerVelocity = playerPaddleX - prevPlayerPaddleX;
  const cpuVelocity = cpuPaddleX - prevCpuPaddleX;
  prevPlayerPaddleX = playerPaddleX;
  prevCpuPaddleX = cpuPaddleX;
  playerLunge *= 0.82;
  cpuLunge *= 0.82;

  if(ball.vy < 0 && cpuLastBallVy >= 0){
    // 玉がCPU方向へ向き始めた瞬間、狙いを新しく決める
    const plans = ['center', 'left', 'right', 'spin'];
    cpuShotPlan = plans[Math.floor(Math.random()*plans.length)];
  }
  cpuLastBallVy = ball.vy;

  if(mode==='cpu' && ball.held!=='cpu'){
    let targetX = ball.x;
    let targetY = PADDLE_Y_TOP;
    let cpuSpeed = 2.5;
    if(ball.faceoff){
      // フェイスオフ中は反応に遅延を持たせ、突撃速度もランダムにブレさせる
      if(cpuFaceoffDelay > 0){
        cpuFaceoffDelay--;
        targetX = cpuPaddleX; targetY = cpuPaddleY; // 反応前はまだ動かない
        cpuSpeed = 0;
      }else{
        targetX = FIELD_W/2 + (Math.random()-0.5) * 4; // わずかな乱れ
        targetY = CPU_Y_MAX;
        cpuSpeed = 2.6 + Math.random() * 1.2; // 2.6〜3.8のブレ
      }
    }else if(ball.vy < 0){
      // 玉がこちらへ向かっている間は前に出て迎え撃つ(氷上の格闘技らしく)
      targetY = CPU_Y_MAX;
      if(cpuShotPlan==='left') targetX = ball.x + PADDLE_W * 0.4;
      else if(cpuShotPlan==='right') targetX = ball.x - PADDLE_W * 0.4;
      else if(cpuShotPlan==='spin'){
        targetX = ball.x + (Math.random()<0.5 ? 1 : -1) * PADDLE_W * 0.4;
        cpuSpeed = 4.2; // 素早く動いてスピンを乗せる
      }
      // 'center'はtargetX=ball.xのまま(ど真ん中直撃)
    }
    if(cpuPaddleX < targetX) cpuPaddleX = Math.min(targetX, cpuPaddleX + cpuSpeed);
    else if(cpuPaddleX > targetX) cpuPaddleX = Math.max(targetX, cpuPaddleX - cpuSpeed);
    cpuPaddleX = clamp(cpuPaddleX, PADDLE_W/2, FIELD_W - PADDLE_W/2);
    if(cpuPaddleY < targetY) cpuPaddleY = Math.min(targetY, cpuPaddleY + cpuSpeed);
    else if(cpuPaddleY > targetY) cpuPaddleY = Math.max(targetY, cpuPaddleY - cpuSpeed);
    cpuPaddleY = clamp(cpuPaddleY, PADDLE_Y_TOP, CPU_Y_MAX);
  }

  // 人間側の操作もCPUと同じ速度上限で、目標地点へ近づける(瞬間移動させない)
  const HUMAN_SPEED = 2.5;
  playerPaddleX = moveToward(playerPaddleX, playerTargetX, HUMAN_SPEED);
  playerPaddleY = moveToward(playerPaddleY, playerTargetY, HUMAN_SPEED);
  if(mode==='pvp'){
    cpuPaddleX = moveToward(cpuPaddleX, cpuTargetX, HUMAN_SPEED);
    cpuPaddleY = moveToward(cpuPaddleY, cpuTargetY, HUMAN_SPEED);
  }

  if(ball.faceoff){
    if(ball.pending){
      faceoffCountdown--;
      if(faceoffCountdown === 40) showCallout('2', 700);
      else if(faceoffCountdown === 20) showCallout('1', 700);
      if(faceoffCountdown <= 0){
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * FACEOFF_CIRCLE_R;
        ball.x = clamp(FIELD_W/2 + Math.cos(angle) * r, BALL_R, FIELD_W - BALL_R);
        ball.y = clamp(FIELD_H/2 + Math.sin(angle) * r, BALL_R, FIELD_H - BALL_R);
        ball.pending = false;
        showCallout('フェイスオフ!', 700);
      }
      render();
      return;
    }
    const playerDist = Math.hypot(ball.x - playerPaddleX, ball.y - playerPaddleY);
    const cpuDist = Math.hypot(ball.x - cpuPaddleX, ball.y - cpuPaddleY);
    const reach = PADDLE_W/2 + BALL_R;
    if(playerDist <= reach){
      const hitOffset = clamp((ball.x - playerPaddleX) / (PADDLE_W/2), -1, 1);
      ball.vy = -4.3;
      ball.vx = clamp(hitOffset * 2.6 + playerVelocity * 1.6, -5, 5);
      ball.faceoff = false;
      feedbackTap();
    }else if(cpuDist <= reach){
      const hitOffset = clamp((ball.x - cpuPaddleX) / (PADDLE_W/2), -1, 1);
      ball.vy = 4.3;
      ball.vx = clamp(hitOffset * 2.6 + cpuVelocity * 1.6, -5, 5);
      ball.faceoff = false;
    }
    render();
    return;
  }

  if(ball.held){
    if(ball.held==='player'){
      ball.x = playerPaddleX;
      ball.y = playerPaddleY - BALL_R - 1;
    }else{
      ball.x = cpuPaddleX;
      ball.y = cpuPaddleY + BALL_R + 1;
      if(mode==='cpu'){
        cpuHoldTicks++;
        if(cpuHoldTicks > 16) releaseBall();
      }
    }
    render();
    return;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  if(ball.x <= BALL_R){ ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if(ball.x >= FIELD_W - BALL_R){ ball.x = FIELD_W - BALL_R; ball.vx = -Math.abs(ball.vx); }

  // 下端(プレイヤー側): パドルの現在位置(前進していれば手前)で判定。隙間を作らない
  if(ball.vy > 0 && ball.y >= playerPaddleY - BALL_R){
    if(Math.abs(ball.x - playerPaddleX) <= PADDLE_W/2 + BALL_R){
      const hitOffset = clamp((ball.x - playerPaddleX) / (PADDLE_W/2), -1, 1);
      ball.vy = clamp(-Math.abs(ball.vy) * 1.03, -MAX_BALL_SPEED, MAX_BALL_SPEED);
      ball.vx = clamp(hitOffset * 2.6 + playerVelocity * 1.6, -5, 5);
      ball.y = playerPaddleY - BALL_R;
      feedbackTap();
    }else if(ball.y >= FIELD_H - BALL_R){
      if(ball.x >= GOAL_LEFT && ball.x <= GOAL_RIGHT){
        scorePoint('cpu');
        return;
      }else{
        ball.y = FIELD_H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
      }
    }
  }
  // 上端(CPU側): 同様にパドルの現在位置で判定
  if(ball.vy < 0 && ball.y <= cpuPaddleY + BALL_R){
    if(Math.abs(ball.x - cpuPaddleX) <= PADDLE_W/2 + BALL_R){
      const hitOffset = clamp((ball.x - cpuPaddleX) / (PADDLE_W/2), -1, 1);
      const speedMul = cpuShotPlan==='center' ? 1.35 : 1.03;
      ball.vy = clamp(Math.abs(ball.vy) * speedMul, -MAX_BALL_SPEED, MAX_BALL_SPEED);
      ball.vx = clamp(hitOffset * 2.6 + cpuVelocity * 1.6, -5, 5);
      ball.y = cpuPaddleY + BALL_R;
      cpuShotPlan = null;
    }else if(ball.y <= BALL_R){
      if(ball.x >= GOAL_LEFT && ball.x <= GOAL_RIGHT){
        scorePoint('player');
        return;
      }else{
        ball.y = BALL_R;
        ball.vy = Math.abs(ball.vy);
      }
    }
  }

  render();
}

let calloutEl, calloutTimer;
function showCallout(text, duration){
  if(!calloutEl) return;
  clearTimeout(calloutTimer);
  calloutEl.textContent = text;
  calloutEl.classList.add('show');
  calloutTimer = setTimeout(()=>{ calloutEl.classList.remove('show'); }, duration || 900);
}

function render(){
  if(!fieldEl) return;
  ballEl.style.opacity = ball.pending ? '0' : '1';
  ballEl.style.left = (ball.x / FIELD_W * 100) + '%';
  ballEl.style.top = (ball.y / FIELD_H * 100) + '%';
  paddleBottomEl.style.left = (playerPaddleX / FIELD_W * 100) + '%';
  paddleTopEl.style.left = (cpuPaddleX / FIELD_W * 100) + '%';
  paddleBottomEl.style.top = (playerPaddleY / FIELD_H * 100 - playerLunge * 5) + '%';
  paddleTopEl.style.top = (cpuPaddleY / FIELD_H * 100 + cpuLunge * 5) + '%';
  pawBottomEl.style.left = (playerPaddleX / FIELD_W * 100) + '%';
  pawTopEl.style.left = (cpuPaddleX / FIELD_W * 100) + '%';
  pawBottomEl.style.top = (Math.min(FIELD_H, playerPaddleY + 8) / FIELD_H * 100) + '%';
  pawTopEl.style.top = (Math.max(0, cpuPaddleY - 8) / FIELD_H * 100) + '%';
  document.getElementById('nyponScoreTop').textContent = score.cpu;
  document.getElementById('nyponScoreBottom').textContent = score.player;
}

function onFieldPointer(clientX, clientY){
  if(gameOver) return;
  const rect = fieldEl.getBoundingClientRect();
  const ratioX = clamp((clientX - rect.left) / rect.width, 0, 1);
  const x = clamp(ratioX * FIELD_W, PADDLE_W/2, FIELD_W - PADDLE_W/2);
  const ratioY = clamp((clientY - rect.top) / rect.height, 0, 1);
  const yRaw = ratioY * FIELD_H;
  if(mode==='pvp'){
    if(ratioY < 0.5){
      cpuTargetX = x;
      cpuTargetY = clamp(yRaw, PADDLE_Y_TOP, CPU_Y_MAX);
    }else{
      playerTargetX = x;
      playerTargetY = clamp(yRaw, PLAYER_Y_MIN, PADDLE_Y_BOTTOM);
    }
  }else{
    playerTargetX = x;
    playerTargetY = clamp(yRaw, PLAYER_Y_MIN, PADDLE_Y_BOTTOM);
  }
}


function init(selectedMode){
  document.body.classList.add('nypon-active');
  fieldEl = document.getElementById('nyponField');
  ballEl = document.getElementById('nyponBall');
  paddleTopEl = document.getElementById('nyponPaddleTop');
  paddleBottomEl = document.getElementById('nyponPaddleBottom');
  pawTopEl = document.getElementById('nyponPawTop');
  pawBottomEl = document.getElementById('nyponPawBottom');
  pawTopEl.innerHTML = pawSvg('cpu');
  calloutEl = document.getElementById('nyponCallout');
  pawBottomEl.innerHTML = pawSvg('player');
  document.getElementById('nyponLabelTop').textContent = mode==='pvp' ? 'プレイヤー2' : 'CPU';
  document.getElementById('nyponLabelBottom').textContent = mode==='pvp' ? 'プレイヤー1' : 'あなた';

  score = { player:0, cpu:0 };
  playerPaddleX = FIELD_W/2;
  cpuPaddleX = FIELD_W/2;
  playerPaddleY = PADDLE_Y_BOTTOM;
  cpuPaddleY = PADDLE_Y_TOP;
  playerTargetX = FIELD_W/2;
  playerTargetY = PADDLE_Y_BOTTOM;
  cpuTargetX = FIELD_W/2;
  cpuTargetY = PADDLE_Y_TOP;
  prevPlayerPaddleX = FIELD_W/2;
  prevCpuPaddleX = FIELD_W/2;
  playerLunge = 0;
  cpuLunge = 0;
  cpuShotPlan = null;
  cpuLastBallVy = 0;
  gameOver = false;
  winner = null;
  startFaceoff();

  let dragging = false;
  let downX = 0, downY = 0, moved = false;
  let samples = [];
  fieldEl.addEventListener('pointerdown', (e)=>{
    dragging = true;
    downX = e.clientX; downY = e.clientY; moved = false;
    samples = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
    onFieldPointer(e.clientX, e.clientY);
    if(fieldEl.setPointerCapture){ try{ fieldEl.setPointerCapture(e.pointerId); }catch(err){} }
  });
  fieldEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    if(Math.abs(e.clientX-downX)>6 || Math.abs(e.clientY-downY)>6) moved = true;
    const now = performance.now();
    samples.push({ t: now, x: e.clientX, y: e.clientY });
    while(samples.length>2 && now - samples[0].t > 140) samples.shift();
    onFieldPointer(e.clientX, e.clientY);
  });
  fieldEl.addEventListener('pointerup', (e)=>{
    dragging = false;
    if(gameOver) return;
    const heldSide = mode==='pvp'
      ? (()=>{ const rect = fieldEl.getBoundingClientRect(); const ratioY = clamp((e.clientY-rect.top)/rect.height,0,1); return ratioY<0.5 ? 'cpu' : 'player'; })()
      : 'player';
    if(ball.held !== heldSide) return;
    if(!moved){
      releaseBall(); // タップ=通常サーブ
      return;
    }
    // フリック判定: 直近のサンプルから速度を算出
    const now = performance.now();
    let flickVx = 0, flickVy = 0;
    if(samples.length>=2){
      const first = samples[0], last = samples[samples.length-1];
      const dt = last.t - first.t;
      if(dt>0){
        flickVx = (last.x-first.x)/dt * 16; // px/ms → ゲーム内速度スケールに変換
        flickVy = (last.y-first.y)/dt * 16;
      }
    }
    const flickStrength = Math.hypot(flickVx, flickVy);
    if(flickStrength > 2.2){
      releaseBall(flickVx, flickVy); // フリックサーブ: 強さと向きを反映
    }
    // 弱いドラッグの終了はただの位置調整として扱い、何もしない
  });
  fieldEl.addEventListener('pointercancel', ()=>{ dragging = false; });

  render();
}

function getResultMessageCpu(resultKind){
  return resultKind==='player' ? `🎉 あなたの勝ち! ${WIN_SCORE}点先取!` : `🐾 CPUの勝ち… ラリー負けです`;
}
function getResultMessagePvp(resultKind){
  return (resultKind==='player' ? 'プレイヤー1' : 'プレイヤー2') + ` の勝ち! ${WIN_SCORE}点先取!`;
}

const howToPlayHtml = buildHowToPlayHtml({
  rules: '試合開始は「3・2・1・フェイスオフ!」の掛け声とともに、パックがセンターサークル内のランダムな位置に現れます。お互いパドルを中央へ寄せて、先に触れた方が最初のシュートを打てます(まれに真ん中に出て両者とも触れることも)。フィールドを左右・前後にドラッグして構え、タップで軽いシュート、素早くフリックすると強さと向きが乗ったシュートになります。パドルは指を離した場所へ瞬間移動せず、CPUと同じ速さでじわっと追いつきます。以降は飛んできたパックをはじき返し合い、上下にある狭いゴールに通したら1点、5点先取で勝ちです。ゴール以外の壁に当たったパックは、その場で跳ね返ります。パドルの端に当てると角度がつき、はじき返す瞬間に左右へ動かすとスピンがかかって軌道が曲がります。',
  intent: '「じゃれ合いタイプ」の1本目です。手数や決着の速さを競う他のゲームと違って、ラリーが続く時間そのものを楽しんでもらえたらと思っています。',
  fun: 'パドルのどこに当てるかで返球の角度が変わるので、狙って角を切ることもできます。CPUの反応速度にはあえて上限を設けているので、揺さぶれば十分に崩せます。ゴールが壁の切れ目だけなので、狙いすましたシュートがより重要になります。',
  different: 'シリーズで唯一のリアルタイム1vs1アクションです。ターン制のゲームが多い中、ここだけ「今」の反射神経で勝負します。'
});

  emoji: '🏓',
  cardIconPlayer: `<div style="width:34px;height:34px;">${pawPongSvg('player')}</div>`,
  cardIconCpu: `<div style="width:34px;height:34px;">${pawPongSvg('cpu')}</div>`,
  title: 'ニャーホッケー',
  desc: '対戦エアホッケー。ドラッグで構えてタップ/フリックでシュート、パックをはじき返し合います。ゴールは壁の切れ目だけ。5点先取で勝敗。シリーズ唯一のリアルタイムアクションです。',
  boardHtml,
  howToPlayHtml,
  init,
  tick,
  tickInterval: 50,
  getResultMessageCpu,
  getResultMessagePvp,
  _test: {
    getBall: ()=>ball,
    setBall: (b)=>{ ball = b; },
    getScore: ()=>score,
    setScore: (s)=>{ score = s; },
    getPlayerPaddleX: ()=>playerPaddleX,
    setPlayerPaddleX: (x)=>{ playerPaddleX = x; },
    getCpuPaddleX: ()=>cpuPaddleX,
    getPlayerPaddleY: ()=>playerPaddleY,
    setPlayerPaddleY: (y)=>{ playerPaddleY = y; },
    getCpuPaddleY: ()=>cpuPaddleY,
    setCpuPaddleY: (y)=>{ cpuPaddleY = y; },
    getGameOver: ()=>gameOver,
    getWinner: ()=>winner,
    onFieldPointer,
    getCpuShotPlan: ()=>cpuShotPlan,
    setCpuShotPlan: (p)=>{ cpuShotPlan = p; },
    tick, scorePoint, resetBall, releaseBall, startFaceoff,
    getCpuFaceoffDelay: ()=>cpuFaceoffDelay,
    getFaceoffCountdown: ()=>faceoffCountdown,
    getCalloutText: ()=> calloutEl ? calloutEl.textContent : null,
    getCalloutShowing: ()=> calloutEl ? calloutEl.classList.contains('show') : false,
    FIELD_W, FIELD_H, PADDLE_W, WIN_SCORE, PLAYER_Y_MIN, CPU_Y_MAX,
  },
});

})();


if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('click', (e)=>{
    const t = e.target;
    if(!t) return;
    const tag = t.tagName;
    const cls = t.className || '';
    if(tag==='BUTTON' || (typeof cls==='string' && (cls.includes('game-cell') || cls.includes('game-card') || cls.includes('nmem-cell') || cls.includes('nario-cell') || cls.includes('ris-cell') || cls.includes('tile') || cls.includes('hand-piece') || cls.includes('dot') || cls.includes('chip')))){
      feedbackTap();
    }
  }, true);
}

buildCardGrid();
buildTitleSlides();
renderMascots();
renderGreeting();
renderTechInfo();
showScreen('screen-list');

</script>
