<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ニャーズ ゲームセンター</title>
<style>
  @font-face{
    font-family:'Hachi Maru Pop';
    src:local('Hachi Maru Pop');
    font-display:swap;
  }
  :root{
    --cream:#FFF8ED;
    --cream-deep:#FCEEDA;
    --cpu-body:#A9B8C4;
    --cpu-accent:#5C7A94;
    --player-body:#F7C99B;
    --player-accent:#D9622B;
    --ink:#4A3B2A;
    --gold:#D4AF37;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--cream);}
  body{
    font-family:'Hachi Maru Pop','Yuji Syuku','Klee One','Rounded Mplus 1c',sans-serif;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .menu-outer{
    width:100%;max-width:560px;padding:8px 16px 30px;
    display:flex;flex-direction:column;align-items:center;
  }
  .menu-wrap{
    width:100%;padding:10px 0;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    transition:transform .35s ease;
  }
  .menu-wrap.flipped{ transform:rotate(180deg); }
  h1{font-size:21px;margin:2px 0 0;text-align:center;color:var(--player-accent);}
  h1 .sub{display:block;font-size:12px;color:var(--cpu-accent);margin-top:6px;font-weight:normal;}

  .flip-btn{
    font-family:inherit;font-size:13px;background:var(--cpu-accent);color:#fff;
    border:none;border-radius:14px;padding:9px 16px;cursor:pointer;
    box-shadow:0 3px 0 #3E5A70;
    margin:6px 0;
  }
  .flip-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3E5A70;}
  .flip-btn.top{ transform:rotate(180deg); }
  .flip-btn.top:active{transform:rotate(180deg) translateY(2px);box-shadow:0 1px 0 #3E5A70;}

  .card-grid{
    width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  }
  .game-card{
    background:linear-gradient(160deg,#fff 0%,var(--cream-deep) 100%);
    border:3px dashed var(--gold);border-radius:20px;
    padding:18px 10px;text-align:center;cursor:pointer;
    box-shadow:0 5px 0 rgba(217,98,43,.15);
    transition:transform .1s;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .game-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(217,98,43,.15);}
  .game-card .emoji{font-size:40px;line-height:1;}
  .game-card .title{font-size:15px;color:var(--ink);}
  .game-card .desc{font-size:11px;color:var(--cpu-accent);line-height:1.5;}
  .game-card .stripe{width:40px;height:4px;border-radius:2px;margin-top:2px;background:linear-gradient(90deg,var(--player-accent),var(--cpu-accent));}

  .footnote{ font-size:11px; color:#b09a7a; text-align:center; margin-top:6px; }
  .greeting-toggle{
    font-size:12px;color:var(--brown-deep);text-align:center;cursor:pointer;
    text-decoration:underline;margin:2px 0;
  }
  .greeting-thanks{ font-weight:bold; color:var(--player-accent); }
  .greeting-sign{ text-align:right; font-size:11px; color:#b09a7a; }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(74,59,42,.55);
    display:flex;align-items:center;justify-content:center;
    z-index:200;padding:16px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:#fff;border-radius:18px;padding:16px;
    max-width:340px;width:100%;max-height:82vh;overflow-y:auto;
    border:3px dashed var(--gold);
  }
  .modal-box h2{margin:0 0 8px;font-size:16px;color:var(--green-deep);text-align:center;}
  .modal-box .rules-text{font-size:13px;line-height:1.7;margin-bottom:10px;}
  .modal-box .rules-text p{ margin:0 0 8px; }
  .modal-box .rules-text p:last-child{ margin-bottom:0; }

  /* ---- ゲーム表示エリア ---- */
  .player-wrap{
    display:none;
    position:fixed;inset:0;background:var(--cream);
    flex-direction:column;
  }
  .player-wrap.active{display:flex;}
  .player-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;background:var(--cream-deep);
    box-shadow:0 2px 0 rgba(217,98,43,.1);
  }
  .player-topbar.top-bar{
    transform:rotate(180deg);
  }
  .player-topbar.bottom-bar{
    box-shadow:0 -2px 0 rgba(217,98,43,.1);
  }
  .player-topbar .gametitle{font-size:14px;color:var(--ink);}
  .back-btn{
    font-family:inherit;font-size:14px;background:var(--cpu-accent);color:#fff;
    border:none;border-radius:12px;padding:8px 14px;cursor:pointer;
    box-shadow:0 3px 0 #3E5A70;
  }
  .back-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3E5A70;}
  iframe.game-frame{
    flex:1;width:100%;border:none;background:var(--cream);
  }
</style>
</head>
<body>

  <div class="menu-outer">
    <button class="flip-btn top" id="btnFlipTop">🔄 反転する</button>
    <div class="menu-wrap" id="menuScreen">
      <h1>🐾 ニャーズ ゲームセンター
        <span class="sub">向かい合って遊ぶ、猫の対戦ゲーム集</span>
      </h1>
      <div class="greeting-toggle" id="greetingToggle">💌 内海からの挨拶</div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="footnote">机に置いたまま、2人で交互にタップして遊べます</div>
    </div>
    <button class="flip-btn" id="btnFlipBottom">🔄 反転する</button>
  </div>

  <div class="modal-overlay hidden" id="greetingModal">
    <div class="modal-box">
      <h2>💌 内海からの挨拶</h2>
      <div class="rules-text">
        <p>このシリーズはまだ VER0.3。これからも少しずつ増えていきます。</p>
        <p>いつも一緒に働いてくれている事業所のスタッフの皆さん、利用者の皆さんに、ちょっとした息抜きの時間になれば嬉しいです。</p>
        <p>そして、いつもお世話になっている居酒屋やカフェ、スナックのママさん、スタッフさん、お客さんにも、気軽に楽しんでもらえたらと思います。</p>
        <p class="greeting-thanks">こんな足りない自分と、いつも関わってくれて本当にありがとうございます。🐾</p>
        <p class="greeting-sign">— 内海</p>
      </div>
      <button class="btn wide" id="btnCloseGreeting" style="margin-top:8px;">閉じる</button>
    </div>
  </div>

  <div class="player-wrap" id="playerScreen">
    <div class="player-topbar top-bar">
      <span class="gametitle" id="playerTitle"></span>
      <button class="back-btn" id="btnBack">一覧に戻る</button>
    </div>
    <iframe class="game-frame" id="gameFrame"></iframe>
    <div class="player-topbar bottom-bar">
      <span class="gametitle" id="playerTitleBottom"></span>
      <button class="back-btn" id="btnBackBottom">一覧に戻る</button>
    </div>
  </div>

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const cardGrid = document.getElementById('cardGrid');
GAMES.forEach(g=>{
  const card = document.createElement('div');
  card.className='game-card';
  card.innerHTML = `
    <div class="emoji">${g.emoji}</div>
    <div class="title">${g.title}</div>
    <div class="desc">${g.desc}</div>
    <div class="stripe"></div>
  `;
  card.addEventListener('click', ()=>openGame(g));
  cardGrid.appendChild(card);
});

const menuScreen = document.getElementById('menuScreen');
const playerScreen = document.getElementById('playerScreen');
const gameFrame = document.getElementById('gameFrame');
const playerTitle = document.getElementById('playerTitle');
const playerTitleBottom = document.getElementById('playerTitleBottom');

function openGame(g){
  playerTitle.textContent = g.title;
  playerTitleBottom.textContent = g.title;
  const html = b64ToUtf8(B64[g.key]);
  gameFrame.srcdoc = html;
  menuScreen.style.display='none';
  playerScreen.classList.add('active');
}

function backToMenu(){
  playerScreen.classList.remove('active');
  menuScreen.style.display='flex';
  gameFrame.srcdoc = 'about:blank';
}
document.getElementById('btnBack').addEventListener('click', backToMenu);
document.getElementById('btnBackBottom').addEventListener('click', backToMenu);
function toggleMenuFlip(){ menuScreen.classList.toggle('flipped'); }
document.getElementById('btnFlipTop').addEventListener('click', toggleMenuFlip);
document.getElementById('btnFlipBottom').addEventListener('click', toggleMenuFlip);
document.getElementById('greetingToggle').addEventListener('click', ()=>{
  document.getElementById('greetingModal').classList.remove('hidden');
});
document.getElementById('btnCloseGreeting').addEventListener('click', ()=>{
  document.getElementById('greetingModal').classList.add('hidden');
});

// 各ゲーム内から「別のゲームに誘う」等でメニューに戻る要求を受け取る
window.addEventListener('message', (e)=>{
  if(e.data && e.data.type==='nyaGamesRequestMenu'){
    backToMenu();
  }
});
</script>
