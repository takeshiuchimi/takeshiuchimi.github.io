audio.addEventListener("error",()=>{$("status").textContent="音源を読み込めません。karaoke.html と同じ階層の music/ フォルダにMP3を配置してください。";});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,track:"シャローム",times:Object.fromEntries(lines.map((x,i)=>[i,x.time])),vocals:Object.fromEntries(lines.map((x,i)=>[i,x.vocal])),splits:Object.fromEntries(lines.map((x,i)=>[i,x.split]))},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shalom_歌詞同期_色分け設定.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.track!=="シャローム")throw Error("別の曲の設定です");if(d.times)Object.entries(d.times).forEach(([i,v])=>{if(lines[i])lines[i].time=Number(v)});if(d.vocals)Object.entries(d.vocals).forEach(([i,v])=>{if(lines[i]&&LABELS[v])lines[i].vocal=v});if(d.splits)Object.entries(d.splits).forEach(([i,v])=>{if(lines[i])lines[i].split=Number(v)});save();buildRows();update(true);alert("設定を読み込みました")}catch(err){alert("読み込みエラー："+err.message)}e.target.value=""};
$("restore").onclick=()=>{if(!confirm("歌詞設定を初期状態に戻しますか？"))return;lines=JSON.parse(JSON.stringify(DEFAULT_LINES));save();buildRows();update(true)};

/* テーマは端末内に記憶。SVGの色もCSS変数で同期する */
const THEME_KEY="caco_karaoke_theme_v1";
function setTheme(theme){
 const t=theme==="light"?"light":"dark";
 document.body.dataset.theme=t;
 const light=t==="light";
 $("themeToggle").textContent=light?"☾ ダーク":"☀ ライト";
 $("stageThemeToggle").textContent=light?"☾":"☀";
 for(const id of ["themeToggle","stageThemeToggle"]){
   $(id).setAttribute("aria-label",light?"ダークモードに切替":"ライトモードに切替");
   $(id).setAttribute("aria-pressed",String(light));
 }
 try{localStorage.setItem(THEME_KEY,t)}catch(e){}
}
function flipTheme(){setTheme(document.body.dataset.theme==="dark"?"light":"dark")}
$("themeToggle").addEventListener("click",flipTheme);
$("stageThemeToggle").addEventListener("click",flipTheme);
try{setTheme(localStorage.getItem(THEME_KEY)||"dark")}catch(e){setTheme("dark")}

audio.src=SOURCES.original;buildRows();update(true);
function openKaraokeQR(){NyaShare.open("karaoke.html",6,"ニャーカラオケ｜シャローム")}
$("karaoke-qr-open").addEventListener("click",openKaraokeQR);
$("karaoke-stage-qr").addEventListener("click",openKaraokeQR);

// 操作パネルの実測高で歌詞位置を調整。テーマ変更でも位置は同一。
const fullPanelHeightObserver=new ResizeObserver(entries=>{
 for(const entry of entries){
  const height=Math.ceil(entry.target.getBoundingClientRect().height);
  if(height>0)document.getElementById('stage').style.setProperty('--full-panel-height',height+'px');
 }
});
fullPanelHeightObserver.observe(document.getElementById('fullControls'));
</script><script>
/* ガイドボーカル：伴奏側は既存の<audio>を100%のまま使い、歌声だけを別音源として重ねる。
   音量はWeb AudioのGainNodeで調整し、伴奏側の再生位置に常に追従させる。 */
(function(){
 const GUIDE_SOURCES={instrumental:"music/shalom01_vocal.mp3",male:"music/shalom01_vocal_female.mp3",female:"music/shalom01_vocal_male.mp3"};
 const GUIDE_KEY="caco_karaoke_guide_v1";
 const $=id=>document.getElementById(id);
 let level=30;
 try{const raw=localStorage.getItem(GUIDE_KEY);if(raw!==null&&raw!==""&&Number.isFinite(Number(raw)))level=Math.min(100,Math.max(0,Math.round(Number(raw))))}catch(e){}
 const guide=new Audio();guide.preload="auto";guide.loop=false;guide.setAttribute("playsinline","");
 let ctx=null,gainNode=null,routed=false,controllable=true,guideError=false;
 const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 const active=()=>Object.prototype.hasOwnProperty.call(GUIDE_SOURCES,mode);
 const target=()=>active()&&controllable&&!guideError?level/100:0;

 function setupGraph(){
  if(routed||ctx===false)return;
  try{
   const AC=window.AudioContext||window.webkitAudioContext;
   // Web Audioを使うのは音量プロパティが効かないiPhone/iPadだけ。
   // Android版Chromeなどでは、Web Audio経由のガイドが無音になる例があるため音量プロパティで直接調整する。
   if(!IOS||!AC||location.protocol==="file:")throw 0; // file:// ではWeb Audioに音源を渡せないため音量プロパティで代替
   try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){} // iPhoneの消音スイッチ中もガイドを鳴らす（iOS 17以降）
   ctx=new AC();
   const node=ctx.createMediaElementSource(guide);
   gainNode=ctx.createGain();gainNode.gain.value=target();
   node.connect(gainNode);gainNode.connect(ctx.destination);routed=true;
  }catch(e){
   ctx=false;
   try{guide.volume=0.5;controllable=Math.abs(guide.volume-0.5)<0.01}catch(err){controllable=false} // iPhoneは音量プロパティが効かない
  }
 }
 function applyGain(){
  const g=target();
  if(routed){try{guide.volume=1}catch(e){}gainNode.gain.setTargetAtTime(g,ctx.currentTime,0.03)}
  else if(controllable){try{guide.volume=g}catch(e){}}
 }
 function canPlayGuide(){return active()&&!guideError&&(routed||controllable)&&guide.getAttribute("src")}
 function hardSync(){if(!canPlayGuide())return;const t=audio.currentTime||0;if(Math.abs((guide.currentTime||0)-t)>0.004){try{guide.currentTime=t}catch(e){}}guide.playbackRate=1}
 function syncPlay(){
  if(!canPlayGuide()||audio.paused||audio.ended||audio.seeking){if(!guide.paused)guide.pause();return}
  if(guide.paused){hardSync();const p=guide.play();if(p&&p.catch)p.catch(()=>{})}
 }
 // 伴奏側の動きにガイドを合わせる（再生・停止・シーク・リピートの巻き戻し・読込待ち）
 audio.addEventListener("play",syncPlay);
 audio.addEventListener("playing",()=>{hardSync();syncPlay()});
 for(const ev of ["pause","waiting","ended","seeking","emptied"])audio.addEventListener(ev,()=>{if(!guide.paused)guide.pause()});
 audio.addEventListener("seeked",()=>{hardSync();syncPlay()});
 // 小さなずれは再生速度の微調整で吸収し、大きなずれは位置を合わせ直す
 setInterval(()=>{
  if(!canPlayGuide()||audio.paused||audio.seeking){return}
  if(guide.paused){syncPlay();return}
  const d=guide.currentTime-audio.currentTime;
  if(Math.abs(d)>0.1)hardSync();
  else if(Math.abs(d)>0.012)guide.playbackRate=Math.min(1.05,Math.max(0.95,1-d*1.5));
  else if(guide.playbackRate!==1)guide.playbackRate=1;
 },200);
 guide.addEventListener("error",()=>{if(!guide.getAttribute("src"))return;guideError=true;applyGain();$("status").textContent="ガイド音源を読み込めません。music/ に "+GUIDE_SOURCES[mode].split("/").pop()+" を配置してください。";refreshUI()});
 function loadGuide(){
  guide.pause();guideError=false;
  if(active()){guide.src=GUIDE_SOURCES[mode];guide.load();try{guide.currentTime=audio.currentTime||0}catch(e){}}
  else{guide.removeAttribute("src");guide.load()}
  applyGain();
 }
 // 操作のたびにWeb Audioを準備（スマホは操作の中でしか音声を開始できない）
 function onGesture(){
  setupGraph();
  if(routed&&ctx.state!=="running")ctx.resume().catch(()=>{});
  applyGain();syncPlay();
 }
 for(const ev of ["click","touchend","keydown"])document.addEventListener(ev,onGesture);
 function refreshUI(){
  for(const [r,o,box] of [["guide","guideValue","guideBox"],["fullGuide","fullGuideValue","fullGuideBox"]]){
   const input=$(r);if(Number(input.value)!==level)input.value=level;
   input.setAttribute("aria-valuetext",level+"%");$(o).textContent=level+"%";
   $(box).classList.toggle("is-off",!active());
  }
  document.querySelectorAll("[data-guide]").forEach(b=>{const on2=Number(b.dataset.guide)===level;b.classList.toggle("on",on2);b.setAttribute("aria-pressed",String(on2))});
  $("guideNote").textContent=!active()?"原曲モードではガイドを使いません。カラオケ・男声・女声モードで有効です。"
   :!controllable?"この端末ではガイド音量を調整できないため、ガイドを止めています。"
   :(IOS&&!navigator.audioSession)?"iPhoneの消音（マナーモード）中はガイドが鳴りません。消音を解除してください。"
   :({"instrumental":"0%で完全カラオケ。伴奏の音量は変わりません。","male":"女性パートの歌声をガイドとして重ねます。","female":"男性パートの歌声をガイドとして重ねます。"})[mode];
 }
 function setLevel(v){
  level=Math.min(100,Math.max(0,Math.round(Number(v)||0)));
  try{localStorage.setItem(GUIDE_KEY,String(level))}catch(e){}
  applyGain();refreshUI();
 }
 for(const id of ["guide","fullGuide"])$(id).addEventListener("input",e=>{setLevel(e.target.value);if(id==="fullGuide"&&typeof showFullControls==="function")showFullControls()});
 document.querySelectorAll("[data-guide]").forEach(b=>b.addEventListener("click",()=>setLevel(b.dataset.guide)));
 // 既存の音源切替にガイドの切替を追加（伴奏側の処理はそのまま）
 const baseSelectMode=selectMode;
 selectMode=function(m){const before=mode;baseSelectMode(m);if(mode!==before)loadGuide();refreshUI();if(active())$("status").textContent+="（ガイド "+level+"%）"};
 window.NyaGuide={get level(){return level},setLevel,guide,get drift(){return guide.paused?null:guide.currentTime-audio.currentTime},get routed(){return routed},get gain(){return routed?gainNode.gain.value:guide.volume},get ctxState(){return ctx?ctx.state:String(ctx)}};
 loadGuide();refreshUI();
 if(new URLSearchParams(location.search).get("debug")==="1"){
  const box=document.createElement("pre");box.id="guideDebug";
  box.style.cssText="white-space:pre-wrap;font-size:11px;line-height:1.5;margin:8px 0 0;padding:8px;border-radius:8px;background:#0008;color:#fff;text-align:left";
  $("guideBox").after(box);
  const rs=["なし","メタデータ","現在位置","先読み","十分"];
  setInterval(()=>{
   const e=guide.error;
   box.textContent=["端末: "+(IOS?"iOS":"その他")+" / audioSession: "+(navigator.audioSession?navigator.audioSession.type:"非対応"),
    "音量調整: "+(routed?"Web Audio ("+ctx.state+")":ctx===false?"音量プロパティ（"+(controllable?"有効":"無効")+"）":"未準備（画面操作待ち）"),
    "ガイド音源: "+(guide.getAttribute("src")||"なし")+" / 読込: "+rs[guide.readyState]+(e?" / エラー"+e.code:""),
    "伴奏: "+(audio.paused?"停止":"再生中")+" "+(audio.currentTime||0).toFixed(2)+"s / ガイド: "+(guide.paused?"停止":"再生中")+" "+(guide.currentTime||0).toFixed(2)+"s",
    "音量: "+level+"% → 実効 "+(routed?gainNode.gain.value:guide.volume).toFixed(2)].join("\n");
  },300);
 }
})();
</script></body></html>
