<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ニャーリハ</title>
<style>
  :root{
    --cream:#FBF6E9; --cream-deep:#F3E6D0; --brown:#8B6F47; --brown-deep:#6B5335;
    --gold:#D4AF37; --player-body:#F7C99B; --player-accent:#D9622B;
    --line-dark:#3A2E20; --card-bg:#FFFFFF; --tile-bg:#FBF6E9;
  }
  html.dark-mode{
    --cream:#181410; --cream-deep:#2E2620; --brown:#B08A5E; --brown-deep:#8C6C48;
    --gold:#E0C158; --player-body:#F7C99B; --player-accent:#E07840;
    --line-dark:#F0E6D8; --card-bg:#3d342a; --tile-bg:#241E18;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--cream); color:var(--line-dark);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    overscroll-behavior:none;
  }
  .app{ max-width:480px; margin:0 auto; padding:10px; }
  h1{ font-size:20px; margin:6px 0 2px; color:var(--brown-deep); }

  /* ---- ニャーズと同じタイトル行(マスコット猫+タイトル+バージョン) ---- */
  .title-row{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  .title-text-col{ flex:1; min-width:0; text-align:left; }
  .list-title{ font-size:16px; margin:0; color:var(--brown-deep); text-align:left; }
  .sub{ display:block; font-size:10px; color:var(--brown-deep); margin-top:2px; }
  .version-badge{
    display:inline-block; font-size:10px; vertical-align:middle;
    background:var(--gold); color:#fff; padding:2px 7px; border-radius:10px; font-weight:bold;
  }
  .dev-build-badge{
    display:inline-block; font-size:10px; vertical-align:middle;
    color:var(--brown-deep); opacity:.75; margin-left:3px;
  }
  .mascot-cat{ width:40px; height:40px; flex-shrink:0; }
  .util-btn{
    font-family:inherit; font-size:16px; background:var(--brown); color:#fff;
    border:none; border-radius:10px; padding:6px 10px; cursor:pointer;
    box-shadow:0 2px 0 var(--brown-deep);
  }
  .util-btn:active{ transform:translateY(2px); box-shadow:none; }

  .hidden{ display:none !important; }

  .program-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---- ニャーズと同じ左右スワイプ無限ループカルーセル ---- */
  .card-pages-wrap{ width:100%; overflow:hidden; touch-action:pan-y; position:relative; }
  .edge-nav-btn{
    position:absolute; top:0; bottom:0; width:15%; max-width:44px; z-index:5; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .edge-nav-btn.left{ left:0; }
  .edge-nav-btn.right{ right:0; }
  .edge-nav-gauge{
    width:30px; height:30px; border-radius:50%; position:relative;
    background:rgba(212,175,55,.15); display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--brown-deep); opacity:.7;
  }
  .edge-nav-btn.active .edge-nav-gauge{ opacity:1; box-shadow:0 0 0 2px var(--gold); }
  .edge-nav-fill{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(var(--gold) 0deg, transparent 0deg);
  }
  .card-pages{ display:flex; transition:transform .28s ease; }
  .card-page{ flex:0 0 100%; width:100%; box-sizing:border-box; padding:2px; }
  .page-dots{ display:flex; justify-content:center; gap:5px; margin:8px 0; }
  .page-dots .dot{
    width:7px; height:7px; border-radius:50%; background:var(--cream-deep);
    box-shadow:inset 0 0 0 1px var(--brown); cursor:pointer;
  }
  .page-dots .dot.active{ background:var(--gold); }
  .program-card{
    background:var(--tile-bg); border:2px solid var(--gold); border-radius:14px;
    padding:12px 8px; text-align:center; cursor:pointer;
    box-shadow:0 4px 0 rgba(139,111,71,.12);
    position:relative; overflow:hidden;
  }
  .program-card:active{ transform:translateY(3px); box-shadow:none; }
  .program-card .icon{ font-size:30px; }
  .program-card .name{ font-size:13px; font-weight:bold; margin-top:4px; }
  .program-card .desc{ font-size:10px; color:var(--brown-deep); margin-top:2px; line-height:1.3; text-align:left; }
  .program-card.disabled{ opacity:.45; cursor:default; }
  .program-card.disabled .name::after{ content:' (準備中)'; font-size:9px; font-weight:normal; }
  .card-dwell-fill{
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background:rgba(212,175,55,.35); z-index:0; pointer-events:none;
    transition:height .05s linear;
  }
  .program-card.dwelling{ box-shadow:0 0 0 3px var(--gold), 0 4px 0 rgba(139,111,71,.12); }
  .program-card > *:not(.card-dwell-fill){ position:relative; z-index:1; }

  .btn{
    font-family:inherit; font-size:14px; background:var(--brown); color:#fff;
    border:none; border-radius:12px; padding:10px 14px; cursor:pointer;
    box-shadow:0 3px 0 var(--brown-deep);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--brown-deep); }
  .btn.back{ background:var(--cream-deep); color:var(--brown-deep); box-shadow:0 3px 0 rgba(139,111,71,.3); }

  .game-header{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .game-header .title{ flex:1; font-size:14px; font-weight:bold; color:var(--brown-deep); }

  .stage{
    position:relative; width:100%; aspect-ratio:3/4; background:#000;
    border-radius:16px; overflow:hidden; border:3px dashed var(--gold);
    box-shadow:0 6px 0 rgba(139,111,71,.15);
  }
  video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1); filter:brightness(.28) saturate(.5);
  }
  canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .hand-cursor{
    position:absolute; width:70px; height:70px; transform:translate(-50%,-50%);
    pointer-events:none; z-index:3; transition:left .05s linear, top .05s linear;
  }
  .hand-cursor svg{ width:100%; height:100%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
  .falling-fruit{
    position:absolute; font-size:26px; transform:translate(-50%,-50%);
    pointer-events:none; z-index:4;
  }

  .game-hud{
    position:absolute; top:6px; left:6px; right:6px; z-index:6;
    display:flex; justify-content:space-between; align-items:center;
    font-size:16px; font-weight:bold; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  #catReaction{ font-size:26px; transition:transform .15s ease; }
  #catReaction.bounce{ transform:scale(1.3) rotate(-8deg); }
  #catReaction.sad{ transform:scale(0.9) rotate(6deg); }
  #comboDisplay{ min-width:70px; text-align:right; color:var(--gold); }

  .callout{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0.7);
    font-size:22px; font-weight:bold; color:var(--gold); z-index:6;
    text-shadow:0 0 6px rgba(0,0,0,.6), 0 0 2px #fff;
    opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease;
    text-align:center; width:90%;
  }
  .callout.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .status{ text-align:center; font-size:12px; color:var(--brown-deep); min-height:18px; margin:6px 0; }

  .overlay-msg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; padding:20px; text-align:center;
    background:rgba(0,0,0,.55); color:#fff; font-size:14px; z-index:5;
  }
  .rating-star{ font-size:44px; text-align:center; }
  .purpose-box{
    font-size:11px; line-height:1.6; text-align:left; opacity:.9;
    background:rgba(255,255,255,.12); border-radius:8px; padding:8px 10px; margin-top:4px;
  }
  #startOverlayText{ text-align:left; width:100%; }
  .dwell-btn{
    position:relative; width:120px; height:120px; margin-top:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .dwell-btn-row{ display:flex; gap:10px; justify-content:center; }
  .dwell-btn-row .dwell-btn{ width:100px; height:100px; }
  .dwell-btn-row .dwell-label{ font-size:12px; }
  .dwell-ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .dwell-ring-bg{ fill:var(--brown); stroke:rgba(255,255,255,.25); stroke-width:8; }
  .dwell-ring-fg{
    fill:none; stroke:var(--gold); stroke-width:8; stroke-linecap:round;
    stroke-dasharray:276.5; stroke-dashoffset:276.5; transition:stroke-dashoffset .05s linear;
  }
  .dwell-label{ position:relative; z-index:1; font-size:14px; font-weight:bold; color:#fff; text-align:center; line-height:1.4; }
  .dwell-label small{ font-size:10px; font-weight:normal; opacity:.85; }
  .dwell-btn.active .dwell-ring-bg{ fill:var(--brown-deep); }

  /* もぎ用 */
  .tree-area{
    position:absolute; left:0; right:0; top:0; height:42%;
    pointer-events:none;
  }
  .tree-area svg{ width:100%; height:100%; display:block; }
  .fruit{
    position:absolute; width:44px; height:44px; transform:translate(-50%,-50%);
    font-size:36px; line-height:44px; text-align:center; pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));
    transition:opacity .15s ease;
  }
  .fruit.collected{ opacity:0; }
  .basket-row{
    position:absolute; left:0; right:0; bottom:6%; display:flex; justify-content:space-around;
    pointer-events:none;
  }
  .basket{
    width:28%; aspect-ratio:6/5; max-width:120px;
    position:relative; border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:6%;
    color:#fff; font-size:12px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .basket > *{ position:relative; z-index:1; }
  .basket .icon{ font-size:22px; }
  .basket .count{ font-size:14px; }
  .basket.glow{ box-shadow:0 0 0 4px #fff, 0 0 14px 4px var(--gold); }
  .basket.aiming{ box-shadow:0 0 0 3px var(--gold); }

  /* ゆらし用 */
  .net-area{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    width:70%; max-width:220px; aspect-ratio:3/1;
    display:flex; align-items:center; justify-content:center;
    font-size:36px; pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
  }
  .shake-gauge{
    position:absolute; left:8%; right:8%; bottom:2%; height:8px;
    background:rgba(0,0,0,.4); border-radius:6px; overflow:hidden; z-index:6;
  }
  .shake-gauge-fill{ height:100%; width:0%; background:var(--gold); transition:width .08s linear; }

  /* ---- カヌー用 ---- */
  .river-area{
    position:absolute; inset:0;
    background:linear-gradient(180deg, #7EC8E3, #4A9BC9);
    pointer-events:none;
  }

  /* ---- てにゃー花火用 ---- */
  .night-sky{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    background:linear-gradient(180deg, #0B1030 0%, #1A1F4D 45%, #2E2A5C 75%, #3D3468 100%);
  }
  .night-sky .moon{ position:absolute; top:6%; right:10%; font-size:30px; opacity:.9; }
  .night-sky .ferris{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:64px; opacity:.35; }
  .night-sky .twinkle{ position:absolute; color:#fff; opacity:.5; font-size:8px; }
  .hanabi-star{
    position:absolute; width:44px; height:44px; transform:translate(-50%,-50%);
    font-size:28px; text-align:center; line-height:44px; pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(255,230,150,.9));
    animation:hanabiStarPulse 1.1s ease-in-out infinite;
  }
  @keyframes hanabiStarPulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.85; }
    50%{ transform:translate(-50%,-50%) scale(1.2); opacity:1; }
  }
  .hanabi-spark{
    position:absolute; width:5px; height:5px; border-radius:50%;
    pointer-events:none; will-change:transform,opacity;
  }

  /* ---- もぎ・ゆらし共通: カメラを隠す森の背景(手だけ見えればいい) ---- */
  .forest-bg{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    background:linear-gradient(180deg, #FFFDF6 0%, #FFFDF6 74%, #A8D68A 74%, #8FC470 100%);
  }
  .forest-bg .sun{ position:absolute; top:5%; right:8%; font-size:34px; opacity:.9; }
  .forest-bg .cloud{ position:absolute; font-size:26px; opacity:.85; }
  .forest-bg .cloud.c1{ top:8%; left:6%; }
  .forest-bg .cloud.c2{ top:16%; left:38%; font-size:20px; opacity:.7; }
  .forest-bg .flower{ position:absolute; bottom:3%; font-size:18px; }
  .forest-bg .flower.f1{ left:10%; }
  .forest-bg .flower.f2{ left:32%; bottom:2%; }
  .forest-bg .flower.f3{ left:58%; }
  .forest-bg .flower.f4{ left:80%; bottom:2%; }
  .canoe-el{
    position:absolute; width:88px; height:88px; transform:translate(-50%,-50%);
    pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
    transition:left .1s linear;
  }
  .canoe-el svg{ width:100%; height:100%; }
  .paddle-el{
    position:absolute; width:100px; height:34px; transform:translate(-50%,-50%);
    pointer-events:none; transition:left .1s linear, top .1s linear, opacity .15s ease, transform .18s ease;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
    opacity:0;
  }
  .paddle-el.show{ opacity:1; }
  .paddle-el.dip-left{ transform:translate(-50%,-50%) rotate(-18deg); }
  .paddle-el.dip-right{ transform:translate(-50%,-50%) rotate(18deg); }
  .paddle-el svg{ width:100%; height:100%; }
  .river-obj{
    position:absolute; width:38px; height:38px; transform:translate(-50%,-50%);
    font-size:30px; text-align:center; line-height:38px; pointer-events:none;
  }
  .paddle-splash{
    position:absolute; width:40px; height:40px; transform:translate(-50%,-50%);
    font-size:24px; text-align:center; line-height:40px; pointer-events:none;
    opacity:0; transition:opacity .3s ease;
  }
  .paddle-splash.show{ opacity:1; }

  /* ---- ニャーズと同じ外枠・モーダル ---- */
  .card{
    width:100%; background:var(--card-bg); border:3px dashed var(--gold);
    border-radius:18px; padding:12px 10px; box-shadow:0 6px 0 rgba(139,111,71,.15);
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,59,42,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:16px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:var(--card-bg); border-radius:18px; padding:16px;
    max-width:340px; width:100%; max-height:82vh; overflow-y:auto;
    border:3px dashed var(--gold);
  }
  .modal-box h2{ margin:0 0 8px; font-size:16px; color:var(--brown-deep); text-align:center; }
  .modal-box .rules-text{ font-size:13px; line-height:1.7; margin-bottom:10px; }
  .modal-box .rules-text p{ margin:0 0 8px; }
  .modal-box .rules-text p:last-child{ margin-bottom:0; }
  .tech-group-heading{ font-size:14px; color:var(--brown-deep); margin:12px 0 4px; border-bottom:2px dashed var(--gold); padding-bottom:3px; }
  .tech-group-heading:first-child{ margin-top:0; }
  .intent-box{
    background:var(--cream-deep); border-radius:10px; padding:8px 10px; margin:6px 0; font-size:12px; line-height:1.6;
  }
  .qr-box{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin:14px 0 4px; padding:12px; background:var(--cream-deep); border-radius:12px;
  }
  .qr-img{ width:180px; height:180px; }
  .qr-img svg{ width:100%; height:100%; display:block; border-radius:6px; overflow:hidden; }
  .qr-box a{ font-size:11px; color:var(--brown-deep); word-break:break-all; text-align:center; }
  .util-row{ display:flex; gap:6px; margin:8px 0; }
  .util-row .util-btn{ flex:1; margin:0; font-size:12px; padding:6px 4px; }
  .util-row .util-btn-icon{ flex:none; width:34px; padding:6px 0; }

  /* ---- ハブ画面: カメラを背景に、コンテンツを半透明で重ねる ---- */
  .hub-with-camera{
    position:relative; overflow:hidden;
    padding:0 !important; border-radius:18px;
  }
  #hubVideo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1); background:#000; z-index:0; filter:brightness(.28) saturate(.5);
  }
  #hubCanvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .hub-camera-msg{
    color:var(--brown-deep); font-size:12px; text-align:center; padding:8px 10px;
    background:var(--cream-deep); border-radius:10px; margin-bottom:8px; line-height:1.6;
  }
  .hub-camera-status{
    text-align:center; font-size:11px; color:var(--brown-deep); margin-bottom:8px;
  }
  .hub-content{
    position:relative; z-index:2; padding:10px;
    background:rgba(255,255,255,.96);
  }
  html.dark-mode .hub-content{ background:rgba(61,52,42,.96); }
</style>
</head>

function makeInfiniteCarousel(cfg){
  const state = { logicalIndex: 0, transitioning: false };
  function mod(n,m){ return ((n%m)+m)%m; }
  function pagesEl(){ return document.getElementById(cfg.pagesElId); }

  function rebuildWindow(){
    const el = pagesEl();
    el.innerHTML = '';
    const total = Math.max(1, cfg.totalPages());
    const prevIdx = mod(state.logicalIndex-1, total);
    const curIdx = mod(state.logicalIndex, total);
    const nextIdx = mod(state.logicalIndex+1, total);
    el.appendChild(cfg.buildSlide(prevIdx));
    el.appendChild(cfg.buildSlide(curIdx));
    el.appendChild(cfg.buildSlide(nextIdx));
    setPos(false);
  }
  function setPos(animated){
    const el = pagesEl();
    el.style.transition = animated ? '' : 'none';
    el.style.transform = 'translateX(-100%)';
    if(!animated){ void el.offsetHeight; el.style.transition = ''; }
  }
  function step(delta){
    if(state.transitioning) return;
    const total = Math.max(1, cfg.totalPages());
    state.transitioning = true;
    const el = pagesEl();
    el.style.transform = `translateX(${delta>0 ? '-200%' : '0%'})`;
    const onEnd = ()=>{
      el.removeEventListener('transitionend', onEnd);
      state.logicalIndex = mod(state.logicalIndex + delta, total);
      rebuildWindow();
      state.transitioning = false;
      if(cfg.onSettle) cfg.onSettle(state.logicalIndex);
    };
    el.addEventListener('transitionend', onEnd);
  }
  function jumpTo(idx){
    const total = Math.max(1, cfg.totalPages());
    state.logicalIndex = mod(idx, total);
    rebuildWindow();
    if(cfg.onSettle) cfg.onSettle(state.logicalIndex);
  }
  function build(){
    state.logicalIndex = 0;
    rebuildWindow();
    if(cfg.onSettle) cfg.onSettle(state.logicalIndex);
  }
  return { step, jumpTo, build, getIndex: ()=>state.logicalIndex };
}

  const card = document.createElement('div');
  card.className = 'program-card' + (item.disabled ? ' disabled' : '');
  card.dataset.key = item.key;
  card.innerHTML = `
    <div class="card-dwell-fill"></div>
    <div class="icon">${item.icon}</div><div class="name">${item.name}</div>

}

const CARDS_PER_PAGE = 6;
// エリア構造をフラット化(見出しは使わず、全プログラムを1つのグリッドに並べる)
const FLAT_ITEMS = [];
AREAS.forEach(area=>{
  area.items.forEach(item=> FLAT_ITEMS.push(item));
});

let pageDotEls = [];
const cardCarousel = makeInfiniteCarousel({
  pagesElId: 'cardPages',
  totalPages: ()=> Math.max(1, Math.ceil(FLAT_ITEMS.length / CARDS_PER_PAGE)),
  buildSlide: (pageIndex)=>{
    const pageEl = document.createElement('div');
    pageEl.className = 'card-page';
    const pageItems = FLAT_ITEMS.slice(pageIndex*CARDS_PER_PAGE, pageIndex*CARDS_PER_PAGE+CARDS_PER_PAGE);
    const grid = document.createElement('div');
    grid.className = 'program-grid';
    pageEl.appendChild(grid);
    pageItems.forEach(item=>{
      grid.appendChild(makeProgramCard(item));
    });
    return pageEl;
  },
  onSettle: (idx)=>{
    pageDotEls.forEach((d,i)=> d.classList.toggle('active', i===idx));
    resetHubDwell();
  },
});

function buildCardCarousel(){
  const dotsEl = document.getElementById('pageDots');
  dotsEl.innerHTML = '';
  pageDotEls = [];
  const totalPages = Math.max(1, Math.ceil(FLAT_ITEMS.length / CARDS_PER_PAGE));
  for(let p=0; p<totalPages; p++){
    const dot = document.createElement('div');
    dot.className = 'dot' + (p===0 ? ' active' : '');
    dot.addEventListener('click', ()=> cardCarousel.jumpTo(p));
    dotsEl.appendChild(dot);
    pageDotEls.push(dot);
  }
  cardCarousel.build();
  setupPageSwipe();
}

let swipeReady = false;
function setupPageSwipe(){
  if(swipeReady) return;
  swipeReady = true;
  const wrap = document.getElementById('cardPagesWrap');
  let startX = null;
  wrap.addEventListener('pointerdown', (e)=>{ startX = e.clientX; });
  wrap.addEventListener('pointerup', (e)=>{
    if(startX===null) return;
    const dx = e.clientX - startX;
    startX = null;
    if(dx > 40) cardCarousel.step(-1);
    else if(dx < -40) cardCarousel.step(1);
  });
  document.getElementById('cardEdgeLeft').addEventListener('click', ()=> cardCarousel.step(-1));
  document.getElementById('cardEdgeRight').addEventListener('click', ()=> cardCarousel.step(1));
}

function classifyHandShape(lm){
  const wrist = lm[0];
  const pairs = [[8,6],[12,10],[16,14],[20,18]]; // 人差し指・中指・薬指・小指
  const extended = pairs.map(([tipIdx, pipIdx])=>{
    const tip = lm[tipIdx], pip = lm[pipIdx];
    const dTip = Math.hypot(tip.x-wrist.x, tip.y-wrist.y);
    const dPip = Math.hypot(pip.x-wrist.x, pip.y-wrist.y);
    return dTip > dPip * 1.15;
  });
  const count = extended.filter(Boolean).length;
  // チョキ: 人差し指・中指だけが伸びていて、薬指・小指は曲がっている
  if(extended[0] && extended[1] && !extended[2] && !extended[3]) return 'choki';
  if(count >= 3) return 'paa';
  return 'guu';
}

function updateShakeDetection(){
  if(gameEnded) return null;
  const now = Date.now();
  const hands = handsList.length > 0 ? handsList.slice(0,2) : [{x:handX, y:handY}];

  function countReversals(arr, axis){
    let reversals = 0, dir = 0;
    for(let i=1;i<arr.length;i++){
      const delta = arr[i][axis] - arr[i-1][axis];
      if(Math.abs(delta) < SHAKE_NOISE_THRESHOLD) continue;
      const newDir = delta > 0 ? 1 : -1;
      if(dir !== 0 && newDir !== dir) reversals++;
      dir = newDir;
    }
    return reversals;
  }

  let maxProgress = 0, triggered = false;
  hands.forEach((h, idx)=>{
    const hist = handXHistoryByHand[idx] || (handXHistoryByHand[idx] = []);
    hist.push({ x: h.x, y: h.y, t: now });
    handXHistoryByHand[idx] = hist.filter(s => now - s.t <= SHAKE_WINDOW_MS);
    const arr = handXHistoryByHand[idx];
    // 左右(x)・上下(y)どちらの往復でも「揺らした」と認識する(多い方を採用)
    const reversals = Math.max(countReversals(arr, 'x'), countReversals(arr, 'y'));
    maxProgress = Math.max(maxProgress, reversals / SHAKE_REQUIRED);
    if(reversals >= SHAKE_REQUIRED && (now - lastShakeAt) > SHAKE_COOLDOWN_MS){
      triggered = true;
      handXHistoryByHand[idx] = [];
    }
  });

  shakeReversals = Math.round(maxProgress * SHAKE_REQUIRED);
  const progress = Math.min(1, maxProgress);
  if(triggered_shakeGaugeFill) triggered_shakeGaugeFill.style.width = (progress*100) + '%';

  if(triggered){
    lastShakeAt = now;
    if(triggered_shakeGaugeFill) triggered_shakeGaugeFill.style.width = '0%';
    return true; // 揺れが発生した合図。呼び出し側(各プログラム)が処理する
  }
  return false;
}

  dwellActiveBtn = null;
  [[retryDwellBtn,retryRingFg],[startDwellBtn,startRingFg],[backDwellBtn,backRingFg]].forEach(([btn,ring])=>{
    if(ring) ring.style.strokeDashoffset = '276.5';
    if(btn) btn.classList.remove('active');
  });
}
function checkGameDwell(){
  let candidates = [];
  if(gameEnded){
    candidates = [
      { btn: retryDwellBtn, ring: retryRingFg, onComplete: doRetry },
      { btn: backDwellBtn, ring: backRingFg, onComplete: backToHub },
    ];
  }else if(!running){
    candidates = [ { btn: startDwellBtn, ring: startRingFg, onComplete: startProgram } ];
  }else{
    resetDwell(); return;
  }

  const stageRect = stageEl.getBoundingClientRect();
  let hovered = null;
  const hands = handsList.length > 0 ? handsList : [{x:handX, y:handY}];
  candidates.forEach(c=>{
    const rect = c.btn.getBoundingClientRect();
    const bx = ((rect.left + rect.width/2 - stageRect.left) / stageRect.width) * 100;
    const by = ((rect.top + rect.height/2 - stageRect.top) / stageRect.height) * 100;
    const bw = (rect.width / stageRect.width) * 100;
    const onThisBtn = hands.some(h => distPct(h.x, h.y, bx, by) < bw/2);
    if(onThisBtn) hovered = c;
  });

  if(hovered){
    if(dwellStartTime === null || dwellActiveBtn !== hovered.btn){
      resetDwell();
      dwellStartTime = Date.now(); dwellActiveBtn = hovered.btn; hovered.btn.classList.add('active');
    }
    const elapsed = Date.now() - dwellStartTime;
    const progress = Math.min(1, elapsed / DWELL_DURATION_MS);
    hovered.ring.style.strokeDashoffset = String(276.5 * (1 - progress));
    if(progress >= 1){ resetDwell(); feedbackTap(); hovered.onComplete(); }
  }else{
    resetDwell();
  }
}

// ---- ハブ画面: プログラムカードも手のドウェルで選べるようにする ----
let hubDwellKey = null;
let hubDwellStartTime = null;
let edgeDwellSide = null;
let edgeDwellStartTime = null;
function resetEdgeDwell(){
  edgeDwellSide = null;
  edgeDwellStartTime = null;
  ['cardEdgeLeft','cardEdgeRight'].forEach(id=>{
    document.getElementById(id).classList.remove('active');
  });
  ['edgeFillLeft','edgeFillRight'].forEach(id=>{
    document.getElementById(id).style.background = 'conic-gradient(var(--gold) 0deg, transparent 0deg)';
  });
}
function resetHubDwell(alsoEdge){
  if(alsoEdge !== false) resetEdgeDwell();
  hubDwellKey = null;
  hubDwellStartTime = null;
  document.querySelectorAll('.program-card').forEach(card=>{
    card.classList.remove('dwelling');
    const fill = card.querySelector('.card-dwell-fill');
    if(fill) fill.style.height = '0%';
  });
}
function checkHubDwell(){
  const hubRect = document.getElementById('screen-hub').getBoundingClientRect();

  // 左右の端(次ページ/前ページ)をチェック
  const edgeLeft = document.getElementById('cardEdgeLeft');
  const edgeRight = document.getElementById('cardEdgeRight');
  let edgeHovered = null;
  const hands = handsList.length > 0 ? handsList : [{x:handX, y:handY}];
  [['left',edgeLeft,-1],['right',edgeRight,1]].forEach(([side,el,delta])=>{
    const rect = el.getBoundingClientRect();
    const cx = ((rect.left + rect.width/2 - hubRect.left) / hubRect.width) * 100;
    const cy = ((rect.top + rect.height/2 - hubRect.top) / hubRect.height) * 100;
    const cw = (rect.width / hubRect.width) * 100;
    const ch = (rect.height / hubRect.height) * 100;
    const onThisEdge = hands.some(h => Math.abs(h.x-cx) < cw/2 && Math.abs(h.y-cy) < ch/2);
    if(onThisEdge){
      edgeHovered = { side, el, delta };
    }
  });

  if(edgeHovered){
    resetHubDwell(false); // カード側のドウェルだけリセット
    if(edgeDwellSide !== edgeHovered.side){
      resetEdgeDwell();
      edgeDwellSide = edgeHovered.side;
      edgeDwellStartTime = Date.now();
      edgeHovered.el.classList.add('active');
    }
    const elapsed = Date.now() - edgeDwellStartTime;
    const progress = Math.min(1, elapsed / DWELL_DURATION_MS);
    const fillEl = document.getElementById(edgeHovered.side==='left' ? 'edgeFillLeft' : 'edgeFillRight');
    fillEl.style.background = `conic-gradient(var(--gold) ${progress*360}deg, transparent ${progress*360}deg)`;
    if(progress >= 1){
      resetEdgeDwell();
      feedbackTap();
      cardCarousel.step(edgeHovered.delta);
    }
    return;
  }else{
    resetEdgeDwell();
  }

  let hovered = null;
  document.querySelectorAll('.program-card').forEach(card=>{
    if(card.classList.contains('disabled')) return;
    const rect = card.getBoundingClientRect();
    const cx = ((rect.left + rect.width/2 - hubRect.left) / hubRect.width) * 100;
    const cy = ((rect.top + rect.height/2 - hubRect.top) / hubRect.height) * 100;
    const cw = (rect.width / hubRect.width) * 100;
    const ch = (rect.height / hubRect.height) * 100;
    // 手の位置がカードの矩形内にあるか(円形近似ではなく矩形で判定)。両手のどちらでもOK
    const onThisCard = hands.some(h => Math.abs(h.x-cx) < cw/2 && Math.abs(h.y-cy) < ch/2);
    if(onThisCard){
      hovered = card;
    }
  });

  if(hovered){
    const key = hovered.dataset.key;
    if(hubDwellKey !== key){
      resetHubDwell();
      hubDwellKey = key;
      hubDwellStartTime = Date.now();
      hovered.classList.add('dwelling');
    }
    const elapsed = Date.now() - hubDwellStartTime;
    const progress = Math.min(1, elapsed / DWELL_DURATION_MS);
    const fill = hovered.querySelector('.card-dwell-fill');
    if(fill) fill.style.height = (progress*100) + '%';
    if(progress >= 1){
      resetHubDwell();
      feedbackTap();
      openProgram(key);
    }
  }else{
    resetHubDwell();
  }
}

function doRetry(){
  resetCommonState();
  const def = PROGRAMS[currentProgramKey];
  def.reset();
  running = true;
  startTimer();
  statusEl.textContent = '手を検出中';
}
document.getElementById('retryDwellBtn').addEventListener('click', doRetry);
document.getElementById('backDwellBtn').addEventListener('click', backToHub);

// ---- 手の検出結果を、現在のプログラムに配る ----
let onHubScreen = true;

function onResults(results){
  // どちらの画面が表示中かで、描画先・処理内容を切り替える
  const activeCanvas = onHubScreen ? hubCanvasEl : canvasEl;
  const activeCtx = onHubScreen ? hubCtx : ctx;
  activeCanvas.width = onHubScreen ? hubVideoEl.clientWidth : stageEl.clientWidth;
  activeCanvas.height = onHubScreen ? hubVideoEl.clientHeight : stageEl.clientHeight;
  activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);

  if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
    lastHandSeen = Date.now();

    // 検出された手を全てhandsListに格納。識別は位置ではなく、MediaPipeが判定する左右(handedness)を使う。
    // (位置だけでは、両手が交差する瞬間に「どちらがどちらか」を区別できないため)
    handsList = results.multiHandLandmarks.map((lm, idx)=>{
      const tip = lm[9];
      const shape = classifyHandShape(lm); // 'guu'|'choki'|'paa'
      // MediaPipeは「入力画像が鏡映し済み」という前提でLeft/Rightを判定する。
      // 当アプリはCSSの見た目だけ鏡映し(scaleX(-1))にしていて、MediaPipeに渡す実際の画像データは
      // 鏡映ししていない生の映像のため、判定結果が実際の左右と逆になる。ここで入れ替えて補正する。
      const rawHandedness = (results.multiHandedness && results.multiHandedness[idx])
        ? results.multiHandedness[idx].label // 'Left'|'Right'(MediaPipeの生の判定、鏡映し前提とズレて逆になっている)
        : (idx===0 ? 'Right' : 'Left'); // フォールバック(古いテスト等でmultiHandednessが無い場合)
      const handedness = rawHandedness === 'Left' ? 'Right' : 'Left';
      return {
        x: (1 - tip.x) * 100,
        y: tip.y * 100,
        shape,
        open: shape === 'paa', // 後方互換(グリップ判定はパー=開いている扱い)
        handedness,
        lm,
      };
    }).sort((a,b)=> a.x - b.x); // 表示上の並びは位置順のままでOK(カーソル表示・ドウェル判定は位置だけ見れば十分なため)

    // 各手に「1フレーム前の自分の形状」を付与(左右(handedness)で同じ手を安定して対応付ける)
    handsList.forEach(h=>{
      h.prevShape = prevHandsShapes[h.handedness] || h.shape;
    });
    const newPrevShapes = {};
    handsList.forEach(h=>{ newPrevShapes[h.handedness] = h.shape; });
    prevHandsShapes = newPrevShapes;

    // 後方互換: 1本目(画面向かって左側)の手をhandX/handY/handOpenとして扱う
    const primary = handsList[0];
    handX = primary.x;
    handY = primary.y;
    prevHandOpen = handOpen;
    handOpen = primary.open;
    handShape = primary.shape;

    if(onHubScreen){
      hubCameraStatus.classList.remove('hidden');
      hubCameraStatus.textContent = handsList.length >= 2 ? '両手を検出中 🐾🐾' : '手を検出中 🐾';
      updateHandCursor();
      checkHubDwell();
    }else{
      if(statusEl.textContent === '手が見つかりません。カメラに手をかざしてください'){
        statusEl.textContent = '手を検出中';
      }
      updateHandCursor();
      checkGameDwell();
      const def = PROGRAMS[currentProgramKey];
      if(def && def.onHand && running && !gameEnded) def.onHand();
    }

    activeCtx.fillStyle = 'rgba(212,175,55,.8)';
    handsList.forEach(h=>{
      h.lm.forEach(p=>{
        const px = (1 - p.x) * activeCanvas.width;
        const py = p.y * activeCanvas.height;
        activeCtx.beginPath(); activeCtx.arc(px, py, 3, 0, Math.PI*2); activeCtx.fill();
      });
    });
  }else{
    handsList = [];
    prevHandsShapes = [];
    if(Date.now() - lastHandSeen > 800){
      if(onHubScreen){
        hubCameraStatus.textContent = '手が見つかりません。カメラに手をかざしてください';
        resetHubDwell();
      }else{
        statusEl.textContent = '手が見つかりません。カメラに手をかざしてください';
        resetDwell();
      }
    }
  }
}

// ハブ画面で1回だけ呼ぶ: カメラ+MediaPipeを起動する(プログラムはまだ始めない)
async function startCameraOnly(){
  hubCameraBtn.disabled = true;
  hubCameraMsg.classList.remove('hidden');
  hubCameraMsg.textContent = 'カメラを起動しています…';
  try{
    if(!hands){
      hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
      hands.onResults(onResults);
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:480}, height:{ideal:640} }, audio:false,
    });
    // 端末スリープや他アプリへの切り替えなどでカメラが切断された時に検知する
    stream.getVideoTracks().forEach(track=>{
      track.addEventListener('ended', onCameraDisconnected);
    });
    hubVideoEl.srcObject = stream;
    await hubVideoEl.play();
    videoEl.srcObject = stream;
    await videoEl.play();
    cameraActive = true;
    hubCameraMsg.classList.add('hidden');
    hubCameraBtn.textContent = '✅ カメラ起動ずみ';
    hubCameraBtn.disabled = false;
    cameraDisconnectedOverlay.classList.add('hidden');

    async function frameLoop(){
      if(!cameraActive) return;
      const sourceVideo = onHubScreen ? hubVideoEl : videoEl;
      await hands.send({image: sourceVideo});
      requestAnimationFrame(frameLoop);
    }
    frameLoop();
    if(!tickIntervalStarted){
      tickIntervalStarted = true;
      setInterval(()=>{ const def = PROGRAMS[currentProgramKey]; if(running && def && def.onTick) def.onTick(); }, 30);
    }
  }catch(e){
    hubCameraMsg.classList.remove('hidden');
    hubCameraMsg.textContent = 'カメラを開始できませんでした: ' + e.message;
    hubCameraBtn.disabled = false;
  }
}
let tickIntervalStarted = false;

// ---- カメラが切断された時の検知・案内・再接続 ----
const cameraDisconnectedOverlay = document.getElementById('cameraDisconnectedOverlay');
function onCameraDisconnected(){
  if(!cameraActive) return; // 既に切断処理済みなら二重に走らせない
  cameraActive = false;
  hubCameraBtn.textContent = '📷 カメラを再接続する';
  hubCameraBtn.disabled = false;
  hubCameraMsg.classList.remove('hidden');
  hubCameraMsg.textContent = 'カメラが切断されました。もう一度カメラをオンにしてください。';
  if(!onHubScreen){
    // ゲーム画面にいる時は、その場で再接続できるオーバーレイを出す
    cameraDisconnectedOverlay.classList.remove('hidden');
  }
}
document.getElementById('reconnectCameraBtn').addEventListener('click', ()=>{
  cameraDisconnectedOverlay.classList.add('hidden');
  startCameraOnly();
});

// タブが非表示→表示に戻った時、カメラのトラックが実際に生きているか確認する
// (端末スリープ・他アプリ切り替え等で、気づかないうちに切断されているケースに対応)
if(typeof document.addEventListener === 'function'){
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!stream) return;
    const stillLive = stream.getVideoTracks().some(t => t.readyState === 'live');
    if(!stillLive && cameraActive){
      onCameraDisconnected();
    }
  });
}

hubCameraBtn.addEventListener('click', startCameraOnly);
// ページを開いたら自動でカメラ起動を試みる(ブラウザの許可ダイアログ自体は省略できないが、
// 「ボタンを押す」という1手順は省ける。拒否された場合はボタンで再試行できる)
startCameraOnly();

/* ============================================================
   プログラム: てにゃーもぎ
   ============================================================ */
(function(){
  let fruits = [];
  let holdingByHand = { Left:null, Right:null }; // 各手(handedness基準)が今もいでいる果物の種類
  let baskets = {};
  let basketCounts = { apple:0, mikan:0, grape:0 };
  let fruitsLayerEl, basketRowEl, heldFruitEl, heldFruitEl2;

  function respawnAllFruits(){
    fruits = respawnAllFruitsInto(fruitsLayerEl);
  }

  function buildBaskets(){
    basketRowEl.innerHTML = '';
    baskets = {};
    basketCounts = { apple:0, mikan:0, grape:0 };
    FRUIT_KEYS.forEach(type=>{
      const el = document.createElement('div');
      el.className = 'basket';
      el.innerHTML = `${basketSvg()}<div class="icon">${FRUITS[type].emoji}</div><div>${FRUITS[type].label}</div><div class="count">0</div>`;
      basketRowEl.appendChild(el);
      baskets[type] = { el, countEl: el.querySelector('.count') };
    });
  }

  function basketBounds(type){
    const rect = baskets[type].el.getBoundingClientRect();
    const stageRect = stageEl.getBoundingClientRect();
    const marginPct = 4; // 判定を少し広めに(かご本体より一回り大きい当たり判定にする)
    return {
      xMin: ((rect.left - stageRect.left) / stageRect.width) * 100 - marginPct,
      xMax: ((rect.right - stageRect.left) / stageRect.width) * 100 + marginPct,
      yTop: ((rect.top - stageRect.top) / stageRect.height) * 100 - marginPct,
    };
  }

  function tryGrab(handedness, hx, hy){
    if(holdingByHand[handedness]) return;
    for(const f of fruits){
      if(f.collected) continue;
      if(distPct(hx, hy, f.x, f.y) < 9){
        holdingByHand[handedness] = f.type;
        f.collected = true;
        f.el.classList.add('collected');
        feedbackTap();
        const hel = handedness==='Left' ? heldFruitEl : heldFruitEl2;
        hel.textContent = FRUITS[f.type].emoji;
        hel.style.left = hx+'%'; hel.style.top = hy+'%';
        statusEl.textContent = FRUITS[f.type].label + ' をもいだ!パーでかごへ';
        return;
      }
    }
  }

  function tryRelease(handedness, hx, hy){
    if(!holdingByHand[handedness]) return;
    const type = holdingByHand[handedness];
    fallingFruits.push({ type, x:hx, y:hy, vy:0, el: makeFallingEl(FRUITS[type].emoji, hx, hy) });
    holdingByHand[handedness] = null;
    const hel = handedness==='Left' ? heldFruitEl : heldFruitEl2;
    hel.textContent = '';
  }

  function updateFallingMogi(){
    // 現在狙っているかご(ハイライト)を一度クリアしてから、落下中の実の位置で判定し直す
    FRUIT_KEYS.forEach(type=> baskets[type].el.classList.remove('aiming'));
    for(let i=fallingFruits.length-1;i>=0;i--){
      const ff = fallingFruits[i];
      ff.vy += GRAVITY; ff.y += ff.vy;
      ff.el.style.left = ff.x+'%'; ff.el.style.top = ff.y+'%';
      let resolved = false;
      for(const type of FRUIT_KEYS){
        const b = basketBounds(type);
        if(ff.x >= b.xMin && ff.x <= b.xMax){
          baskets[type].el.classList.add('aiming'); // 今このかごの真上を通過中
        }
        if(ff.y >= b.yTop && ff.x >= b.xMin && ff.x <= b.xMax){
          if(type === ff.type){
            onSuccess();
            basketCounts[type]++;
            baskets[type].countEl.textContent = basketCounts[type];
            statusEl.textContent = FRUITS[type].label + '、正解のかごにストン!';
            baskets[type].el.classList.add('glow');
            setTimeout(()=> baskets[type].el.classList.remove('glow'), 300);
          }else{
            onMiss('あっ、'+FRUITS[ff.type].label+'は違うかごに落ちちゃった');
            const f = fruits.find(f=>f.type===ff.type && f.collected);
            if(f){ f.collected=false; f.el.classList.remove('collected'); }
          }
          resolved = true; break;
        }
      }
      if(!resolved && ff.y >= 92){
        onMiss(FRUITS[ff.type].label + 'は地面に落ちちゃった…');
        const f = fruits.find(f=>f.type===ff.type && f.collected);
        if(f){ f.collected=false; f.el.classList.remove('collected'); }
        resolved = true;
      }
      if(resolved){
        ff.el.remove();
        fallingFruits.splice(i,1);
        if(fruits.filter(f=>!f.collected).length === 0) setTimeout(respawnAllFruits, 500);
      }
    }
  }

  registerProgram('mogi', {
    title: '🍎 てにゃーもぎ',
    durationSec: 60,
    introHtml: 'カメラを使って、手の動きで果物をもぎ取ります。<br>60秒でどれだけかごに入れられるか挑戦!<br>カメラへのアクセスを許可してください。',
    layerHtml: `
      ${FOREST_BG_HTML}
      <div class="tree-area">${TREE_SVG}</div>
      <div id="mogiFruitsLayer"></div>
      <div class="basket-row" id="mogiBasketRow"></div>
      <div class="held-fruit-mogi" id="mogiHeldFruit" style="position:absolute;font-size:26px;transform:translate(-50%,-120%);pointer-events:none;z-index:4;"></div>
      <div class="held-fruit-mogi" id="mogiHeldFruit2" style="position:absolute;font-size:26px;transform:translate(-50%,-120%);pointer-events:none;z-index:4;"></div>
    `,
    setup(){
      fruitsLayerEl = document.getElementById('mogiFruitsLayer');
      basketRowEl = document.getElementById('mogiBasketRow');
      heldFruitEl = document.getElementById('mogiHeldFruit');
      heldFruitEl2 = document.getElementById('mogiHeldFruit2');
    },
    start(){
      holdingByHand = { Left:null, Right:null };
      buildBaskets();
      respawnAllFruits();
    },
    reset(){
      holdingByHand = { Left:null, Right:null };
      heldFruitEl.textContent = '';
      heldFruitEl2.textContent = '';
      this.start();
    },
    onHand(){
      handsList.slice(0,2).forEach(h=>{
        if(h.prevShape !== 'paa' && h.shape === 'paa') tryRelease(h.handedness, h.x, h.y);
        else if(h.prevShape === 'paa' && h.shape !== 'paa') tryGrab(h.handedness, h.x, h.y);
        if(holdingByHand[h.handedness]){
          const hel = h.handedness==='Left' ? heldFruitEl : heldFruitEl2;
          hel.style.left = h.x+'%'; hel.style.top = h.y+'%';
        }
      });
    },
    onTick(){ updateFallingMogi(); },
  });
})();

/* ============================================================
   プログラム: てにゃーゆらし
   ============================================================ */
(function(){
  let fruits = [];
  let fruitsLayerEl, shakeGaugeFillEl;
  const CATCH_RADIUS = 10;

  function respawnAllFruits(){
    fruits = respawnAllFruitsInto(fruitsLayerEl);
  }

  function triggerShake(){
    const remaining = fruits.filter(f=>!f.collected);
    if(remaining.length === 0) return;
    feedbackTap();
    statusEl.textContent = '木が揺れた!実が落ちてくる';
    showCallout('ゆさっ!');
    const dropCount = Math.min(remaining.length, 1 + (Math.random()<0.4?1:0));
    const shuffled = remaining.slice().sort(()=>Math.random()-0.5);
    for(let i=0;i<dropCount;i++){
      const f = shuffled[i];
      f.collected = true; f.el.classList.add('collected');
      fallingFruits.push({ type:f.type, x:f.x, y:f.y, vy:0, el: makeFallingEl(FRUITS[f.type].emoji, f.x, f.y) });
    }
  }

  function updateFallingYurashi(){
    for(let i=fallingFruits.length-1;i>=0;i--){
      const ff = fallingFruits[i];
      ff.vy += GRAVITY; ff.y += ff.vy;
      ff.el.style.left = ff.x+'%'; ff.el.style.top = ff.y+'%';
      let resolved = false;
      // 両手のうち、どちらか近い方でキャッチできればOK
      const caught = handsList.some(h => distPct(h.x, h.y, ff.x, ff.y) < CATCH_RADIUS);
      if(caught){
        onSuccess();
        statusEl.textContent = 'キャッチ成功!';
        resolved = true;
      }else if(ff.y >= 90){
        onMiss('あーん、キャッチできなかった…');
        resolved = true;
      }
      if(resolved){
        ff.el.remove();
        fallingFruits.splice(i,1);
        if(fruits.filter(f=>!f.collected).length === 0) setTimeout(respawnAllFruits, 500);
      }
    }
  }

  registerProgram('yurashi', {
    title: '🌳 てにゃーゆらし',
    durationSec: 60,
    introHtml: 'カメラを使って、手を左右に振って木を揺らします。<br>落ちてきた実を手でキャッチ!60秒で何個キャッチできるか挑戦。<br>カメラへのアクセスを許可してください。',
    layerHtml: `
      ${FOREST_BG_HTML}
      <div class="tree-area">${TREE_SVG}</div>
      <div id="yurashiFruitsLayer"></div>
      <div class="net-area">🧺</div>
      <div class="shake-gauge"><div class="shake-gauge-fill" id="yurashiShakeGaugeFill"></div></div>
    `,
    setup(){
      fruitsLayerEl = document.getElementById('yurashiFruitsLayer');
      shakeGaugeFillEl = document.getElementById('yurashiShakeGaugeFill');
      triggered_shakeGaugeFill = shakeGaugeFillEl;
    },
    start(){
      triggered_shakeGaugeFill = shakeGaugeFillEl;
      respawnAllFruits();
    },
    reset(){ this.start(); },
    onHand(){
      const shaken = updateShakeDetection();
      if(shaken) triggerShake();
    },
    onTick(){ updateFallingYurashi(); },
  });
})();

/* ============================================================
   プログラム: てにゃーカヌー
   ============================================================ */
(function(){
  const CANOE_Y = 78; // カヌーのy位置(%、固定)
  const OBSTACLE_SPEED = 0.28; // %/tick(前は0.45、ゆっくりに)
  const HIT_RADIUS_X = 7; // %(前は9、岩に少しシビアに=避けやすく)
  const SPAWN_CHANCE = 0.028; // tickごとの出現確率(前は0.045、間隔を広く)

  const RIVER_OBJS = {
    rock:  { emoji:'🪨', kind:'obstacle' },
    fish:  { emoji:'🐟', kind:'item' },
    leaf:  { emoji:'🍃', kind:'item' },
  };
  const ROCK_WEIGHT = 2, ITEM_WEIGHT = 3; // rock:item比率を下げて岩を減らす(前は3:2)

  let canoeEl, riverLayerEl, splashEl, paddleEl;
  // 縦向きの舟形。船首(上)・船尾(下)、水面の波線は含めない(背景の川で表現済み)
  const CANOE_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 6 Q76 32 79 50 Q76 68 50 94 Q24 68 21 50 Q24 32 50 6 Z" fill="#A9744F" stroke="#6B5335" stroke-width="3"/>
    <path d="M32 40 L68 40 M30 50 L70 50 M32 60 L68 60" stroke="#6B5335" stroke-width="2" opacity=".5"/>
    <circle cx="50" cy="50" r="9" fill="var(--player-body)"/>
  </svg>`;
  // パドル(カヌーパドル、両端に水かきがある1本のオール)。真上から見た構図で、体の前に横向きで持つ
  const PADDLE_SVG = `<svg viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="14" width="100" height="6" rx="3" fill="#8B6F47" stroke="#6B5335" stroke-width="1.5"/>
    <ellipse cx="14" cy="17" rx="16" ry="10" fill="#C9A876" stroke="#6B5335" stroke-width="2"/>
    <ellipse cx="126" cy="17" rx="16" ry="10" fill="#C9A876" stroke="#6B5335" stroke-width="2"/>
  </svg>`;
  let canoeX = 50;
  let objects = []; // {type, x, y, el}
  // 手ごとに独立した「漕ぎ」履歴を持つ(片手の時はindex0だけ使う、両手の時はindex0,1両方)
  let paddleYHistoryByHand = [[], []];
  let lastPaddleAtByHand = [0, 0];
  const PADDLE_WINDOW_MS = 500;
  const PADDLE_DROP_PCT = 12; // この割合以上、短時間でYが下がったら1回の漕ぎと判定
  const PADDLE_COOLDOWN_MS = 350;

  function pickObjType(){
    const r = Math.random() * (ROCK_WEIGHT + ITEM_WEIGHT*2);
    if(r < ROCK_WEIGHT) return 'rock';
    if(r < ROCK_WEIGHT + ITEM_WEIGHT) return 'fish';
    return 'leaf';
  }

  function spawnObject(){
    const type = pickObjType();
    const x = 15 + Math.random()*70;
    const el = document.createElement('div');
    el.className = 'river-obj';
    el.textContent = RIVER_OBJS[type].emoji;
    el.style.left = x+'%'; el.style.top = '-6%';
    riverLayerEl.appendChild(el);
    objects.push({ type, x, y:-6, el });
  }

  // 片手なら「その手が操縦もパドルも兼用」、両手なら「中央位置で操縦、どちらの手のひと漕ぎも検知」
  const STEER_OFFSET = 8; // 片手の時、利き手側に応じてカヌーの中心をどれだけずらすか(%)
  const STEER_SMOOTH = 0.35; // 位置の追従の滑らかさ(0-1、大きいほど追従が速いが手ブレも伝わりやすい)
  function updateCanoeFromHands(){
    if(handsList.length === 0){
      paddleEl.classList.remove('show');
      return;
    }
    let targetX;
    if(handsList.length >= 2){
      // 両手: 2本の中心をカヌーの位置とする
      const xs = handsList.slice(0,2).map(h=>h.x);
      targetX = (xs[0] + xs[1]) / 2;
    }else{
      // 片手: 右手なら少し左に、左手なら少し右にずらした位置をカヌーの位置とする
      // (パドルを片手で持っている時、体の中心は持ち手と逆側に少し寄る感覚に合わせる)
      const h = handsList[0];
      targetX = h.handedness === 'Right' ? h.x - STEER_OFFSET : h.x + STEER_OFFSET;
    }
    targetX = Math.max(8, Math.min(92, targetX));
    // 毎フレーム目標位置に少しずつ近づける(手のブレをそのまま反映しないよう滑らかにする)
    canoeX = canoeX + (targetX - canoeX) * STEER_SMOOTH;
    canoeEl.style.left = canoeX+'%';

    // グー(パドルを握っている)の手があるかどうかで、パドルの出現・漕ぎ判定を行う
    let gripping = false;
    handsList.slice(0,2).forEach((h,i)=>{
      if(h.shape === 'guu'){
        gripping = true;
        if(checkPaddleStrokeForHand(i, h.y)) showPaddleSplash();
      }
    });

    if(gripping){
      // パドルは手の生の位置ではなく、カヌーの体の前に、横向きに持っているように表示する
      paddleEl.classList.add('show');
      paddleEl.style.left = canoeX + '%';
      paddleEl.style.top = (CANOE_Y - 3) + '%';
    }else{
      paddleEl.classList.remove('show');
    }
  }

  function checkPaddleStrokeForHand(idx, y){
    const now = Date.now();
    const hist = paddleYHistoryByHand[idx];
    hist.push({ y, t: now });
    paddleYHistoryByHand[idx] = hist.filter(s => now - s.t <= PADDLE_WINDOW_MS);
    if(paddleYHistoryByHand[idx].length < 2) return false;
    const oldest = paddleYHistoryByHand[idx][0];
    const drop = y - oldest.y;
    if(drop >= PADDLE_DROP_PCT && (now - lastPaddleAtByHand[idx]) > PADDLE_COOLDOWN_MS){
      lastPaddleAtByHand[idx] = now;
      paddleYHistoryByHand[idx] = [];
      return true;
    }
    return false;
  }

  let paddleDipSide = 'left'; // 次の一漕ぎでどちら側に傾けるか(交互に切り替える)
  function showPaddleSplash(){
    feedbackTap();
    const splashOffsetX = paddleDipSide === 'left' ? -12 : 12;
    splashEl.style.left = (canoeX + splashOffsetX)+'%';
    splashEl.style.top = (CANOE_Y+4)+'%';
    splashEl.textContent = '💦';
    splashEl.classList.add('show');
    setTimeout(()=> splashEl.classList.remove('show'), 300);

    // パドルを実際の漕ぎ動作のように左右交互に傾ける
    paddleEl.classList.remove('dip-left','dip-right');
    void paddleEl.offsetWidth; // 再生成してアニメーションをリセット
    paddleEl.classList.add(paddleDipSide === 'left' ? 'dip-left' : 'dip-right');
    paddleDipSide = paddleDipSide === 'left' ? 'right' : 'left';
    setTimeout(()=> paddleEl.classList.remove('dip-left','dip-right'), 220);
  }

  function updateRiver(){
    for(let i=objects.length-1; i>=0; i--){
      const o = objects[i];
      o.y += OBSTACLE_SPEED;
      o.el.style.top = o.y+'%';
      if(Math.abs(o.y - CANOE_Y) < 6 && Math.abs(o.x - canoeX) < HIT_RADIUS_X){
        if(RIVER_OBJS[o.type].kind === 'obstacle'){
          onMiss('岩にぶつかった!');
        }else{
          onSuccess();
          statusEl.textContent = RIVER_OBJS[o.type].emoji + ' ゲット!';
        }
        o.el.remove();
        objects.splice(i,1);
        continue;
      }
      if(o.y > 106){
        o.el.remove();
        objects.splice(i,1);
      }
    }
    if(Math.random() < SPAWN_CHANCE) spawnObject();
  }

  registerProgram('canoe', {
    title: '🛶 てにゃーカヌー',
    durationSec: 60,
    introHtml: 'カメラを使って、手の位置でカヌーを操縦します。<br>グーで握るとパドルが出ます。そのまま上下に振って漕ぎながら、岩を避けて魚をゲット!<br>両手でも片手でも遊べます。<br>カメラへのアクセスを許可してください。',
    layerHtml: `
      <div class="river-area"></div>
      <div id="canoeRiverLayer"></div>
      <div class="canoe-el" id="canoeEl"></div>
      <div class="paddle-el" id="paddleEl"></div>
      <div class="paddle-splash" id="paddleSplash"></div>
    `,
    setup(){
      canoeEl = document.getElementById('canoeEl');
      canoeEl.innerHTML = CANOE_SVG;
      paddleEl = document.getElementById('paddleEl');
      paddleEl.innerHTML = PADDLE_SVG;
      riverLayerEl = document.getElementById('canoeRiverLayer');
      splashEl = document.getElementById('paddleSplash');
    },
    start(){
      canoeX = 50;
      canoeEl.style.left = '50%';
      canoeEl.style.top = CANOE_Y+'%';
      paddleEl.classList.remove('show','dip-left','dip-right');
      paddleDipSide = 'left';
      objects.forEach(o=>o.el.remove());
      objects = [];
      paddleYHistoryByHand = [[], []];
      lastPaddleAtByHand = [0, 0];
    },
    reset(){ this.start(); },
    onHand(){
      updateCanoeFromHands();
    },
    onTick(){ updateRiver(); },
  });
})();

/* ============================================================
   プログラム: てにゃー花火
   ============================================================ */
(function(){
  const STAR_HOLD_MS = 700; // 星に手を合わせ続ける時間
  const CATCH_RADIUS = 9; // %
  const SPARK_COLORS = ['#FFD98A','#FFB347','#FFE9B0','#FFC978','#FFF3D6'];

  let starEl, sparkLayerEl;
  let starX = 50, starY = 30;
  let holdStartAt = null;

  function spawnStar(){
    starX = 15 + Math.random()*70;
    starY = 10 + Math.random()*45;
    starEl.style.left = starX+'%';
    starEl.style.top = starY+'%';
    starEl.classList.remove('hidden');
    holdStartAt = null;
  }

  function launchFirework(x, y){
    const sparkCount = 28;
    for(let i=0;i<sparkCount;i++){
      const angle = (Math.PI*2 * i / sparkCount) + (Math.random()*0.3);
      const dist = 60 + Math.random()*40;
      const el = document.createElement('div');
      el.className = 'hanabi-spark';
      el.style.left = x+'%';
      el.style.top = y+'%';
      el.style.background = SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
      sparkLayerEl.appendChild(el);
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      if(el.animate){
        const anim = el.animate([
          { transform:'translate(-50%,-50%) translate(0px,0px)', opacity:1 },
          { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px)`, opacity:0 }
        ], { duration: 900 + Math.random()*300, easing:'cubic-bezier(0.15,0.7,0.3,1)' });
        anim.onfinish = ()=> el.remove();
      }else{
        setTimeout(()=> el.remove(), 1000); // Web Animations API非対応環境向けフォールバック
      }
    }
  }

  registerProgram('hanabi', {
    title: '🎆 てにゃー花火',
    durationSec: 80,
    introHtml: 'カメラを使って、夜空に浮かぶ星に手を合わせます。<br>しばらく手を合わせ続けると花火が上がります!<br>のんびり楽しんでください。失敗はありません。<br>カメラへのアクセスを許可してください。',
    layerHtml: `
      <div class="night-sky">
        <div class="moon">🌙</div>
        <div class="ferris">🎡</div>
      </div>
      <div id="hanabiSparkLayer"></div>
      <div class="hanabi-star" id="hanabiStar">⭐</div>
    `,
    setup(){
      starEl = document.getElementById('hanabiStar');
      sparkLayerEl = document.getElementById('hanabiSparkLayer');
    },
    start(){
      spawnStar();
    },
    reset(){ this.start(); },
    onHand(){
      const hands = handsList.length > 0 ? handsList : [{x:handX,y:handY}];
      const near = hands.some(h => distPct(h.x, h.y, starX, starY) < CATCH_RADIUS);
      if(near){
        if(holdStartAt === null) holdStartAt = Date.now();
        const elapsed = Date.now() - holdStartAt;
        if(elapsed >= STAR_HOLD_MS){
          onSuccess();
          launchFirework(starX, starY);
          starEl.classList.add('hidden');
          holdStartAt = null;
          setTimeout(spawnStar, 500);
        }
      }else{
        holdStartAt = null;
      }
    },
    onTick(){},
  });
})();

buildCardCarousel();
