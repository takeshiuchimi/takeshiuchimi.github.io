<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>🍜 ラーメン利府街道</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&amp;family=Oswald:wght@400;700&amp;family=Zen+Antique&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F1E7D2;--bg2:#FBF6EB;--bg3:#F4EDDA;--bg4:#EADFCB;
  --gold:#AD8A54;--gold2:#C7A76D;--text:#3B2E22;--text2:#5C4A38;
  --muted:#998D7E;--muted2:#776B5D;--border:#D8C9B0;--border2:#CDBB9F;
  --green:#7C8B5D;--green-deep:#5F6E45;
  --ramen:#C66A33;--ramen2:#A9522A;--ramen-dim:rgba(198,106,51,.10);
  --radius:12px;--overlay:rgba(59,46,34,.58);
  --cat-body:#EAD2B3;--cat-accent:#F6E4B9;--cat-eye:#6B5138;--cat-line:#8A6848;
}
html.dark-mode{
  --bg:#181410;--bg2:#3D342A;--bg3:#241E18;--bg4:#2F2821;
  --gold:#E0BC4A;--gold2:#E8CA68;--text:#EFE6D6;--text2:#D8CCBA;
  --muted:#8F806D;--muted2:#B8A68E;--border:#4D4034;--border2:#625141;
  --green:#8FB56E;--green-deep:#A8D488;
  --ramen:#D87C42;--ramen2:#F0A166;--ramen-dim:rgba(216,124,66,.13);
  --overlay:rgba(20,16,12,.84);
  --cat-body:#6F4526;--cat-accent:#9B6A34;--cat-eye:#120D09;--cat-line:#2E1B10;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 12% 8%,rgba(124,139,93,.06),transparent 34%),
    radial-gradient(circle at 88% 82%,rgba(198,106,51,.06),transparent 36%),
    var(--bg);
  color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;
  transition:background .25s,color .25s;
}
button{font:inherit}
header{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,rgba(251,246,235,.98),rgba(241,231,210,.95));
  border-bottom:1px solid var(--border);box-shadow:0 4px 16px rgba(74,52,35,.10);
  padding:9px 12px;
}
html.dark-mode header{background:linear-gradient(180deg,#181410,#241E18);box-shadow:0 4px 16px rgba(0,0,0,.28)}
.header-inner{
  max-width:480px;margin:auto;display:grid;
  grid-template-columns:42px 1fr auto;grid-template-rows:17px 27px;
  column-gap:9px;align-items:center;
}
.header-cat{grid-row:1/3;width:38px;height:44px;display:block}
.header-cat svg{width:100%;height:100%;display:block}
.eyebrow{grid-column:2;grid-row:1;font:10px/17px 'Oswald',sans-serif;letter-spacing:2.2px;color:var(--green-deep)}
header h1{grid-column:2;grid-row:2;font-size:18px;line-height:27px;letter-spacing:.5px;white-space:nowrap}
header h1 em{color:var(--ramen2);font-style:normal}
.header-actions{grid-column:3;grid-row:1/3;display:flex;gap:4px}
.icon-btn{
  width:31px;height:31px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg3);color:var(--green-deep);cursor:pointer;
  display:grid;place-items:center;font-size:14px;
}
.wrap{max-width:480px;margin:auto;padding:14px}
.hero{
  position:relative;overflow:hidden;text-align:center;
  background:linear-gradient(135deg,var(--ramen-dim),rgba(173,138,84,.06));
  border:1px solid color-mix(in srgb,var(--ramen) 28%,transparent);
  border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;
}
.hero::after{content:'🍜';position:absolute;right:-8px;bottom:-14px;font-size:72px;opacity:.07;pointer-events:none}
.hero-title{font-family:'Zen Antique',serif;font-size:22px;color:var(--ramen2);letter-spacing:2px;margin-bottom:7px}
.hero-sub{font-size:11px;color:var(--text2);line-height:1.9}
.hero-count{font:30px/1.2 'Oswald',sans-serif;color:var(--ramen2);margin-top:6px}
.hero-count span{font-size:10px;color:var(--muted2);margin-left:4px}
.tab-nav{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:14px;gap:4px}
.tab-btn{flex:1;padding:8px 3px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted2);font-size:11px;font-weight:700;cursor:pointer}
.tab-btn span{display:block;font-size:15px;margin-bottom:1px}
.tab-btn .cnt{font:9px 'Oswald',sans-serif;color:var(--muted2);margin-top:1px}
.tab-btn.on{background:var(--bg3);color:var(--ramen2);border-color:color-mix(in srgb,var(--ramen) 30%,transparent)}
.tab-btn.on .cnt{color:var(--ramen)}
.panel{display:none}
.panel.on{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.shop{
  position:relative;overflow:hidden;display:flex;gap:11px;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 13px 13px 16px;margin-bottom:9px;
}
.shop::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--ramen),var(--gold))}
.shop-num{font:700 18px 'Oswald',sans-serif;color:var(--ramen);min-width:30px;text-align:center}
.shop-body{flex:1;min-width:0}
.shop-name{font-size:13px;font-weight:700;line-height:1.45;margin-bottom:4px}
.shop-info{font-size:10px;color:var(--muted2);line-height:1.8;margin-bottom:7px}
.shop-info .line2{color:var(--text2)}
.shop-menu{display:flex;flex-wrap:wrap;gap:4px}
.menu-item{font-size:9.5px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:2px 7px;border-radius:6px}
.price{color:var(--ramen2);font-weight:700;margin-left:3px}
.note{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.8;padding:10px;border:1px dashed var(--border);border-radius:var(--radius);margin-top:14px}
footer{max-width:480px;margin:auto;padding:8px 14px 22px;text-align:center}
.footer-tools{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.footer-btn{border:0;border-radius:999px;padding:6px 13px;background:var(--green);color:#fff;font-size:10.5px;cursor:pointer;box-shadow:0 2px 0 var(--green-deep)}
.footer-btn:active{transform:translateY(2px);box-shadow:none}
.footer-row{display:flex;justify-content:center;align-items:center;gap:8px;font-size:9.5px;color:var(--muted2);border-top:1px solid var(--border);padding-top:10px}
.footer-row a{color:var(--green-deep);text-decoration:none}
.footer-dot{color:var(--gold)}
.modal{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:18px;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{
  position:relative;width:min(100%,430px);max-height:84vh;overflow:auto;
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:23px 19px 19px;box-shadow:0 22px 60px rgba(0,0,0,.28);
}
.modal-card h2{font-size:16px;color:var(--green-deep);text-align:center;margin-bottom:13px}
.modal-close{position:absolute;right:9px;top:7px;width:30px;height:30px;border:0;background:transparent;color:var(--muted2);font-size:22px;cursor:pointer}
.message-body p,.tech-section p{font-size:11.5px;line-height:1.85;color:var(--text2);margin-bottom:11px}
.message-body p:last-child,.tech-section:last-child p{margin-bottom:0}
.qr-wrap{width:min(280px,82vw);margin:18px auto 2px;text-align:center}
.qr-wrap img{display:block;width:100%;height:auto;background:#fff;padding:8px;border-radius:4px}
.qr-label{font-size:9px;color:var(--muted2);margin-top:7px;letter-spacing:0;word-break:break-all}
.tech-section{margin-bottom:13px}
.tech-section h3{font-size:12.5px;color:var(--green-deep);margin-bottom:4px;padding-bottom:3px;border-bottom:1px dashed var(--gold)}
@media(max-width:360px){
  header h1{font-size:16px}
  .header-inner{grid-template-columns:38px 1fr auto;column-gap:6px}
  .icon-btn{width:29px;height:29px}
}

.qr-url{
  margin-top:5px;
  font:9px/1.5 'Oswald',sans-serif;
  color:var(--muted2);
  word-break:break-all;
}

.shop-photos{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.shop-photo-wrap{position:relative;flex:0 0 auto;cursor:pointer;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg3);padding:0}
.shop-photo-wrap img{display:block;height:120px;width:auto;max-width:240px;object-fit:cover}
.shop-photo-label{position:absolute;left:0;right:0;bottom:0;padding:13px 6px 5px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);color:#fff;font-size:9px;line-height:1.3;text-align:center}
.photo-modal{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.88);opacity:0;pointer-events:none;transition:opacity .2s}
.photo-modal.open{opacity:1;pointer-events:auto}
.photo-modal-inner{position:relative;width:min(100%,760px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:8px}
.photo-modal img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;background:#111}
.photo-modal-caption{color:#fff;font-size:11px;text-align:center;letter-spacing:.4px}
.photo-modal-close{position:absolute;right:-4px;top:-36px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const DATA=JSON.parse(document.getElementById('siteData').textContent);
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.title='🍜 '+DATA.meta.title;
  $('#site-eyebrow').textContent=DATA.meta.eyebrow;
  $('#footer-title').textContent=DATA.meta.title;
  $('#home-link').href=DATA.meta.homeUrl;
  $('#nya-link').href=DATA.meta.nyaUrl;

  $('#hero-title').textContent=DATA.meta.heroTitle;
  $('#hero-sub').innerHTML=DATA.meta.heroLines.map(esc).join('<br>');
  $('#hero-count-num').textContent=DATA.meta.total;
  $('#note').textContent=DATA.meta.note;

  $('#tab-nav').innerHTML=DATA.areas.map((a,i)=>`
    <button class="tab-btn ${i===0?'on':''}" type="button" data-index="${i}">
      <span>${esc(a.icon)}</span>${esc(a.name)}<div class="cnt">${a.shops.length}店</div>
    </button>`).join('');

  $('#panels').innerHTML=DATA.areas.map((a,i)=>`
    <section class="panel ${i===0?'on':''}" id="panel-${i}">
      ${a.shops.map(s=>`
        <article class="shop">
          <div class="shop-num">${esc(s.number)}</div>
          <div class="shop-body">
            <div class="shop-name">${esc(s.name)}</div>
            <div class="shop-info">
              <div>${esc(s.info1)}</div>
              <div class="line2">${esc(s.info2)}</div>
            </div>
            <div class="shop-menu">
              ${s.menu.map(m=>`<div class="menu-item">${esc(m.name)}<span class="price">${esc(m.price)}</span></div>`).join('')}
            </div>
          </div>
        </article>`).join('')}
    </section>`).join('');

  $('#tab-nav').addEventListener('click',e=>{
    const btn=e.target.closest('.tab-btn'); if(!btn)return;
    const idx=Number(btn.dataset.index);
    document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('on',i===idx));
    document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('on',i===idx));
  });

  const root=document.documentElement,themeBtn=$('#theme-toggle');
  if(localStorage.getItem('ramen_rifu_theme')==='dark')root.classList.add('dark-mode');
  const syncTheme=()=>{
    const dark=root.classList.contains('dark-mode');
    themeBtn.textContent=dark?'☀':'🌙';
    themeBtn.title=dark?'ライトモード切替':'ダークモード切替';
    themeBtn.setAttribute('aria-label',themeBtn.title);
  };
  syncTheme();
  themeBtn.addEventListener('click',()=>{
    root.classList.toggle('dark-mode');
    localStorage.setItem('ramen_rifu_theme',root.classList.contains('dark-mode')?'dark':'light');
    syncTheme();
  });

  const openModal=id=>{const m=$('#'+id);m.classList.add('open');m.setAttribute('aria-hidden','false')};
  const closeModal=id=>{const m=$('#'+id);m.classList.remove('open');m.setAttribute('aria-hidden','true')};

  $('#message-title').textContent=DATA.message.title;
  $('#message-body').innerHTML=DATA.message.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('');
  if(DATA.message.qrDataUri){
    $('#share-qr').src=DATA.message.qrDataUri;
    $('#qr-label').textContent=DATA.message.qrLabel;
    $('#qr-url').textContent=DATA.message.url;
  }else $('#qr-wrap').hidden=true;

  $('#tech-title').textContent=DATA.techInfo.title;
  $('#tech-body').innerHTML=DATA.techInfo.sections.map(s=>`
    <section class="tech-section"><h3>${esc(s.heading)}</h3><p>${esc(s.body)}</p></section>`).join('');

  $('#message-btn').addEventListener('click',()=>openModal('message-modal'));
  $('#tech-btn').addEventListener('click',()=>openModal('tech-modal'));
  document.addEventListener('click',e=>{
    const closer=e.target.closest('[data-close]');
    if(closer)closeModal(closer.dataset.close);
    if(e.target.classList.contains('modal'))closeModal(e.target.id);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id));
      if(document.getElementById('photo-modal')?.classList.contains('open')) closePhoto();
    }
  });

  const photoCfg=DATA.photos;
  const photoModal=document.getElementById('photo-modal');
  const photoModalImg=document.getElementById('photo-modal-img');
  const photoCaption=document.getElementById('photo-caption');

  function openPhoto(url,caption){
    photoModalImg.src=url;
    photoModalImg.alt=caption;
    photoCaption.textContent=caption;
    photoModal.classList.add('open');
    photoModal.setAttribute('aria-hidden','false');
  }

  function closePhoto(){
    photoModal.classList.remove('open');
    photoModal.setAttribute('aria-hidden','true');
    photoModalImg.src='';
  }

  document.getElementById('photo-modal-close').addEventListener('click',closePhoto);
  photoModal.addEventListener('click',e=>{if(e.target===photoModal)closePhoto();});

  async function loadShopPhotos(){
    if(!photoCfg)return;
    const api=`https://api.github.com/repos/${photoCfg.repo}/contents/${photoCfg.directory}?ref=${photoCfg.branch}`;
    const rawBase=`https://raw.githubusercontent.com/${photoCfg.repo}/${photoCfg.branch}/${photoCfg.directory}/`;
    try{
      const res=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
      if(!res.ok)return;
      const files=await res.json();
      if(!Array.isArray(files))return;

      const allowed=new Set(photoCfg.enabledExtensions.map(x=>x.toLowerCase()));
      const photoMap={};

      files.forEach(f=>{
        if(!f?.name)return;
        const m=f.name.match(/^(\d+)_(.+)\.([^.]+)$/);
        if(!m)return;
        const ext=m[3].toLowerCase();
        if(!allowed.has(ext))return;
        const num=m[1].padStart(2,'0');
        const label=m[2].replace(/_/g,' ');
        (photoMap[num]??=[]).push({
          label,
          url:rawBase+encodeURIComponent(f.name)
        });
      });

      Object.entries(photoMap).forEach(([num,photos])=>{
        const card=[...document.querySelectorAll('.shop')].find(shop=>
          shop.querySelector('.shop-num')?.textContent.trim().padStart(2,'0')===num
        );
        if(!card)return;
        const body=card.querySelector('.shop-body');
        if(!body||body.querySelector('.shop-photos'))return;

        photos.sort((a,b)=>a.label.localeCompare(b.label,'ja'));
        const gallery=document.createElement('div');
        gallery.className='shop-photos';

        photos.forEach(p=>{
          const wrap=document.createElement('button');
          wrap.type='button';
          wrap.className='shop-photo-wrap';
          wrap.setAttribute('aria-label',p.label);

          const img=document.createElement('img');
          img.src=p.url;
          img.alt=p.label;
          img.loading='lazy';

          const label=document.createElement('div');
          label.className='shop-photo-label';
          label.textContent=p.label;

          wrap.append(img,label);
          wrap.addEventListener('click',()=>openPhoto(p.url,p.label));
          gallery.appendChild(wrap);
        });

        body.appendChild(gallery);
      });
    }catch(err){
      console.warn('写真取得失敗:',err);
    }
  }

  loadShopPhotos();

});
</script>
</body>
</html>
