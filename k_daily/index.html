<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kさんの日常</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&amp;family=Oswald:wght@400;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F1E7D2;
  --bg2:#FBF6EB;
  --bg3:#F4EDDA;
  --bg4:#EADFCB;
  --gold:#AD8A54;
  --gold2:#C7A76D;
  --text:#3B2E22;
  --text2:#5C4A38;
  --muted:#998D7E;
  --muted2:#776B5D;
  --border:#D8C9B0;
  --border2:#CDBB9F;
  --radius:12px;
  --green:#7C8B5D;
  --green-deep:#5F6E45;
  --k:#B77A92;
  --k2:#9E607B;
  --k-dim:rgba(183,122,146,0.12);
  --overlay:rgba(59,46,34,.55);
  --cat-body:#ead2b3;
  --cat-accent:#f6e4b9;
  --cat-eye:#6b5138;
  --cat-line:#8a6848;
}
html.dark-mode{
  --bg:#181410;
  --bg2:#3D342A;
  --bg3:#241E18;
  --bg4:#2F2821;
  --gold:#E0BC4A;
  --gold2:#E8CA68;
  --text:#EFE6D6;
  --text2:#D8CCBA;
  --muted:#8F806D;
  --muted2:#B8A68E;
  --border:#4D4034;
  --border2:#625141;
  --green:#8FB56E;
  --green-deep:#A8D488;
  --k:#D784A4;
  --k2:#EEA8C3;
  --k-dim:rgba(215,132,164,.14);
  --overlay:rgba(20,16,12,.82);
  --cat-body:#6f4526;
  --cat-accent:#9b6a34;
  --cat-eye:#120d09;
  --cat-line:#2e1b10;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 12% 8%,rgba(124,139,93,.06),transparent 34%),
    radial-gradient(circle at 88% 82%,rgba(183,122,146,.07),transparent 36%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Serif JP',serif;
  min-height:100vh;
  padding-bottom:20px;
  transition:background .3s,color .3s;
}

header{
  background:linear-gradient(180deg,rgba(251,246,235,.97),rgba(241,231,210,.94));
  border-bottom:1px solid var(--border);
  padding:10px 14px 9px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 16px rgba(74,52,35,.10);
  transition:background .3s,border-color .3s;
}
html.dark-mode header{
  background:linear-gradient(180deg,#181410,#241E18);
  box-shadow:0 4px 16px rgba(0,0,0,.28);
}
.header-inner{
  max-width:480px;margin:0 auto;
  display:grid;
  grid-template-columns:42px 1fr auto;
  grid-template-rows:18px 26px;
  column-gap:9px;row-gap:1px;
  align-items:center;
}
.header-cat{
  grid-column:1;grid-row:1 / 3;
  width:38px;height:44px;display:block;
  text-decoration:none;
}
.header-cat svg{width:100%;height:100%;display:block;}
.header-cat:hover{transform:translateY(-1px);}
.logo{
  grid-column:2;grid-row:1;
  font-family:'Oswald',sans-serif;
  font-size:10px;letter-spacing:2.3px;
  color:var(--green-deep);
  line-height:18px;
}
header h1{
  grid-column:2;grid-row:2;
  font-size:19px;font-weight:900;
  color:var(--text);letter-spacing:1.5px;
  line-height:26px;text-align:left;
  white-space:nowrap;
}
header h1 em{color:var(--k2);font-style:normal;}
.header-actions{
  grid-column:3;grid-row:1 / 3;
  display:flex;gap:4px;align-items:center;
}
.vt-btn,.theme-btn{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--muted2);
  font-size:14px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.vt-btn.on{
  background:var(--k-dim);
  border-color:var(--k);
  color:var(--k2);
}
.theme-btn{
  color:var(--green-deep);
}
.theme-btn:hover,.vt-btn:hover{border-color:var(--gold);}


.wrap{max-width:480px;margin:0 auto;padding:18px 14px;}

/* プロフィール */
.profile{background:linear-gradient(135deg,var(--k-dim),rgba(212,168,67,0.06));border:1px solid rgba(212,88,154,0.25);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;}
.profile-icon{font-size:36px;width:56px;height:56px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(212,88,154,0.3);flex-shrink:0;}
.profile-name{font-size:18px;font-weight:900;color:var(--k2);margin-bottom:4px;}
.profile-bio{font-size:11px;color:var(--text2);line-height:1.8;}

/* 毒度フィルター */
.doku-filter{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.doku-filter::-webkit-scrollbar{display:none;}
.df-btn{flex-shrink:0;padding:5px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--muted2);font-size:10px;cursor:pointer;transition:all 0.2s;font-family:'Noto Serif JP',serif;}
.df-btn.on{background:var(--k-dim);border-color:var(--k);color:var(--k2);}

.timeline-label{font-size:10px;letter-spacing:4px;color:var(--muted2);text-transform:uppercase;margin-bottom:14px;padding-left:2px;}

/* 毒度バッジ */
.doku-badge{font-size:9px;letter-spacing:1px;padding:1px 7px;border-radius:20px;border:1px solid;margin-left:6px;font-family:'Oswald',sans-serif;vertical-align:middle;}

/* リスト表示 */
.post{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;transition:border-color 0.2s;}
.post:hover{border-color:rgba(212,88,154,0.35);}
.post.hidden{display:none;}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
.post-avatar{font-size:18px;width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,88,154,0.3);flex-shrink:0;}
.post-meta{flex:1;}
.post-name{font-size:13px;font-weight:700;color:var(--k2);}
.post-date{font-size:10px;color:var(--muted2);margin-top:1px;}
.post-location{font-size:10px;color:var(--muted2);}
.post-location em{color:var(--text2);font-style:normal;}
.post-img{width:100%;display:block;}
.post-serif{margin:12px 14px 0;background:var(--bg3);border-left:3px solid var(--k);border-radius:0 8px 8px 0;padding:10px 14px;font-size:18px;font-weight:900;color:var(--text);line-height:1.5;letter-spacing:1px;}
.post-body{padding:10px 14px 14px;}
.post-text{font-size:12px;color:var(--text2);line-height:1.9;}
.post-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.tag{font-size:10px;color:var(--k);padding:2px 8px;background:var(--k-dim);border:1px solid rgba(212,88,154,0.25);border-radius:20px;}
.post-footer{padding:8px 14px 12px;border-top:1px solid var(--border);display:flex;gap:16px;}
.reaction{font-size:11px;color:var(--muted2);}

/* タイル表示 */
#tile-view{display:none;grid-template-columns:1fr 1fr;gap:8px;}
#tile-view.on{display:grid;}
#list-view.off{display:none;}
.tile{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:pointer;aspect-ratio:3/4;}
.tile.hidden{display:none;}
.tile-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.tile:hover .tile-img{transform:scale(1.04);}
.tile-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 50%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:10px;opacity:0;transition:opacity .25s;
}
.tile.open .tile-overlay{opacity:1;}
.tile-serif{font-size:12px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:4px;}
.tile-loc{font-size:9px;color:rgba(255,255,255,.7);margin-bottom:4px;}
.tile-stars{font-size:11px;}

/* こもれび風フッター */
footer{
  max-width:480px;margin:0 auto;
  padding:10px 14px 24px;
  text-align:center;
  border-top:1px solid var(--border);
}
.footer-row{
  display:flex;align-items:center;justify-content:center;
  gap:10px;font-size:10px;color:var(--muted2);
}
.footer-row a{
  color:var(--green-deep);
  text-decoration:none;
}
.footer-dot{color:var(--gold);}

/* ライトボックス */
#lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.97);display:none;align-items:flex-start;justify-content:center;}
#lightbox.on{display:flex;}
#lb-scroll{overflow-y:auto;max-height:100vh;width:100%;max-width:480px;padding:56px 0 40px;scrollbar-width:none;}
#lb-scroll::-webkit-scrollbar{display:none;}
#lb-close{position:fixed;top:16px;right:16px;z-index:10000;font-size:22px;color:var(--muted2);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border-radius:50%;}
#lb-prev,#lb-next{position:fixed;top:45%;transform:translateY(-50%);font-size:22px;color:var(--muted2);cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border-radius:50%;transition:all 0.2s;z-index:10000;}
#lb-prev{left:4px;}#lb-next{right:4px;}
#lb-prev:hover,#lb-next:hover{color:var(--k2);background:var(--k-dim);}
#lb-counter{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:var(--muted2);z-index:10000;}

/* ライトボックス内カード（リストと同じ構成） */
#lb-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:0 14px;}
#lb-header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
#lb-avatar{font-size:18px;width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,88,154,0.3);flex-shrink:0;}
#lb-meta-wrap{flex:1;}
#lb-name{font-size:13px;font-weight:700;color:var(--k2);}
#lb-date{font-size:10px;color:var(--muted2);margin-top:1px;}
#lb-loc{font-size:10px;color:var(--muted2);}
#lb-img{width:100%;display:block;}
#lb-serif{margin:12px 14px 0;background:var(--bg3);border-left:3px solid var(--k);border-radius:0 8px 8px 0;padding:10px 14px;font-size:18px;font-weight:900;color:var(--text);line-height:1.5;letter-spacing:1px;}
#lb-body-wrap{padding:10px 14px 14px;}
#lb-text{font-size:12px;color:var(--text2);line-height:1.9;}
#lb-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
#lb-footer{padding:8px 14px 12px;border-top:1px solid var(--border);display:flex;gap:16px;}
.lb-reaction{font-size:11px;color:var(--muted2);}
.post-img,.tile-img,#lb-img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:auto;}


html.dark-mode .post,
html.dark-mode #lb-card,
html.dark-mode .df-btn,
html.dark-mode .profile,
html.dark-mode .profile-icon,
html.dark-mode .post-avatar,
html.dark-mode .post-serif{
  background-color:var(--bg2);
}
html.dark-mode .tile{border-color:var(--border);}
html.dark-mode .post:hover{border-color:rgba(215,132,164,.38);}
html.dark-mode .profile{
  background:linear-gradient(135deg,var(--k-dim),rgba(224,188,74,.04));
}
html.dark-mode .vt-btn,
html.dark-mode .theme-btn{
  background:var(--bg3);
}
.profile{
  background:linear-gradient(135deg,var(--k-dim),rgba(173,138,84,.06));
}
.post{box-shadow:0 6px 18px rgba(74,52,35,.05);}
html.dark-mode .post{box-shadow:none;}


.footer-tools{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:8px;
}
.footer-btn{
  font-family:'Noto Serif JP',serif;
  font-size:11px;
  color:#fff;
  background:var(--green);
  border:none;
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  box-shadow:0 2px 0 var(--green-deep);
}
.footer-btn:active{
  transform:translateY(2px);
  box-shadow:none;
}
.info-modal{
  position:fixed;
  inset:0;
  z-index:10020;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:var(--overlay);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
.info-modal.open{
  opacity:1;
  pointer-events:auto;
}
.info-modal-card{
  position:relative;
  width:min(100%,430px);
  max-height:82vh;
  overflow-y:auto;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px 20px 20px;
  box-shadow:0 22px 60px rgba(0,0,0,.28);
  color:var(--text);
}
.info-modal-card h2{
  font-size:17px;
  color:var(--green-deep);
  text-align:center;
  margin:0 0 14px;
}
.info-modal-close{
  position:absolute;
  top:8px;
  right:10px;
  width:30px;
  height:30px;
  border:none;
  background:transparent;
  color:var(--muted2);
  font-size:22px;
  cursor:pointer;
}
.tech-section{
  margin:0 0 14px;
}
.tech-section:last-child{
  margin-bottom:0;
}
.tech-section h3{
  font-size:13px;
  color:var(--green-deep);
  margin:0 0 5px;
  padding-bottom:3px;
  border-bottom:1px dashed var(--gold);
}
.tech-section p{
  font-size:12px;
  line-height:1.8;
  color:var(--text2);
  margin:0;
}

.message-copy{
  font-size:12px;
  line-height:1.9;
  color:var(--text2);
}
.message-copy p{margin:0 0 12px;}
.message-copy p:last-child{margin-bottom:0;}
.message-qr{
  margin:16px auto 8px;
  width:min(220px,72vw);
  text-align:center;
}
.message-qr img{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
}
.message-url{
  margin-top:8px;
  font-family:'Oswald',sans-serif;
  font-size:9px;
  letter-spacing:.2px;
  color:var(--muted2);
  word-break:break-all;
}
</style>
</head>
<body>
<header>
<div class="header-inner">
<a aria-label="ニャーズゲームセンター" class="header-cat" href="https://takeshiuchimi.github.io/nya/index.html" rel="noopener" target="_blank"><svg aria-label="ニャーズ" role="img" viewbox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="50" cy="88" fill="var(--cat-body)" rx="30" ry="26"></ellipse>
<path d="M22 92 Q10 100 16 112 Q24 116 28 104 Z" fill="var(--cat-body)"></path>
<path d="M20 22 L34 46 L14 46 Z" fill="var(--cat-body)"></path>
<path d="M80 22 L86 46 L66 46 Z" fill="var(--cat-body)"></path>
<circle cx="50" cy="52" fill="var(--cat-body)" r="30"></circle>
<circle cx="39" cy="50" fill="var(--cat-eye)" r="3.4"></circle>
<circle cx="61" cy="50" fill="var(--cat-eye)" r="3.4"></circle>
<path d="M45 60 Q50 64 55 60" fill="none" stroke="var(--cat-line)" stroke-linecap="round" stroke-width="2.2"></path>
<line stroke="var(--cat-line)" stroke-width="1.4" x1="18" x2="34" y1="55" y2="57"></line>
<line stroke="var(--cat-line)" stroke-width="1.4" x1="18" x2="34" y1="61" y2="61"></line>
<line stroke="var(--cat-line)" stroke-width="1.4" x1="82" x2="66" y1="55" y2="57"></line>
<line stroke="var(--cat-line)" stroke-width="1.4" x1="82" x2="66" y1="61" y2="61"></line>
</svg></a>
<div class="logo">TakeshiUchimiProject</div>
<h1>👩 <em>K</em>さんの日常</h1>
<div class="header-actions">
<button class="vt-btn on" id="btn-list" title="リスト">☰</button>
<button class="vt-btn" id="btn-tile" title="タイル">⊞</button>
<button aria-label="ダークモード切替" class="theme-btn" id="theme-toggle" title="ダークモード切替" type="button">🌙</button>
</div>
</div>
</header>
<div class="wrap">
<div class="profile">
<div class="profile-icon">👩</div>
<div>
<div class="profile-name" id="profile-name"></div>
<div class="profile-bio" id="profile-bio"></div>
</div>
</div>
<div class="doku-filter">
<button class="df-btn on" data-level="0">すべて</button>
<button class="df-btn" data-level="5">★★★★★ 超毒</button>
<button class="df-btn" data-level="4">★★★★ 毒強め</button>
<button class="df-btn" data-level="3">★★★ 普通盛り</button>
<button class="df-btn" data-level="2">★★ 薄め</button>
<button class="df-btn" data-level="1">★ 無害</button>
</div>
<div class="timeline-label">Recent Posts</div>
<div id="list-view"></div>
<div id="tile-view"></div>
</div>
<footer>
<div class="footer-tools">
<button class="footer-btn" id="message-btn" type="button">💬 内海から</button><button class="footer-btn" id="tech-info-btn" type="button">🔧 技術情報</button>
</div>
<div class="footer-row">
<a href="https://takeshiuchimi.github.io/">TakeshiUchimiProject</a>
<span class="footer-dot">·</span>
<span>Kさんの日常</span>
</div>
</footer>
<div aria-hidden="true" class="info-modal" id="tech-info-modal">
<div aria-labelledby="tech-info-title" aria-modal="true" class="info-modal-card" role="dialog">
<button aria-label="閉じる" class="info-modal-close" id="tech-info-close" type="button">×</button>
<h2 id="tech-info-title"></h2>
<div id="tech-info-body"></div>
</div>
</div>
<div aria-hidden="true" class="info-modal" id="message-modal">
<div aria-labelledby="message-title" aria-modal="true" class="info-modal-card" role="dialog">
<button aria-label="閉じる" class="info-modal-close" id="message-close" type="button">×</button>
<h2 id="message-title"></h2>
<div class="message-copy" id="message-body"></div>
<div class="message-qr">
<img alt="Kさんの日常 QRコード" id="message-qr-img"/>
<div class="message-url" id="message-url"></div>
</div>

を優先しています。"},{"heading":"世界観と技術を共通化","body":"ライトテーマは「こもれび」の生成り・淡い茶・くすみ緑を基準にし、ダークモードは「ニャーズ」の暗色テーマを基準にしています。猫からニャーズへ移動できる導線も含め、TakeshiUchimiProject全体で見た目と操作思想を揃えています。"},{"heading":"ここが内海の意図","body":"軽量化のために読めなくするのではなく、読めるまま無駄をなくす。人間が見てもAIが見ても意図が分かり、次の修正につなげられる状態を残す。完成品を固定するのではなく、増やしながら改善し続けられる土台として作っています。"},{"heading":"精密チェックで削った無駄","body":"最終確認では、同じ画像タップ処理が二重登録されていた部分、タイルのインライン処理とJavaScript処理の重複、表示切替でCSSとstyle属性を併用していた部分を整理しました。タイルからライトボックスを開く際も、タイル番号ではなく元の投稿番号を参照するように統一し、表示順が変わっても別の投稿を開かない構造にしています。"}]},"message":{"title":"内海から","paragraphs":["Kさんの日常は、何か特別な出来事だけを残すページではありません。食べたもの、出かけた場所、その時に出た一言。そういう何気ない日常の中に、その人らしさや、その時にしかない面白さがあると思っています。","写真だけを並べるのではなく、場所や言葉、毒度まで一緒に残しているのは、あとから見た時に「この時こんなこと言ってたな」と、その場の空気まで思い出せるようにしたいからです。","このページ自体も、見た目だけではなく、軽く、壊れにくく、増やしやすく、人にもAIにも読める形を大切にしています。完成させて終わりではなく、日常が続く限り少しずつ増えて、少しずつ良くなっていくページにしたいと思っています。","よかったら、このQRからまた遊びに来てください。"],"url":"https://takeshiuchimi.github.io/k_daily/index.html","qrDataUri":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYgAAAGIAQAAAABzOEqLAAAC+klEQVR4nO2bS3LjMAxEu6d8/yv3LNAAqVlMVRZiaBL2wpasVyGEgPiKwg9ff34KNNFEE000cSDxAQDGd1GECECEQAgAkScBaNGq7iU+AOI+p1YAMVQhANT4HlfsKcdhBEkgjCEMg6GWfNcVm8vx9cRnPhBi0xKgsAZRAB8x8Z5ynEmEKeTtl0DlyV9c1U2E7SNUQFsFGHuWICo2r1LSpnKcQkBS2cN/3uPiPeU4hXj4BjrQdZxbZzFftKccpxDWB519OP2YTkXABYdci1Z1LxG2IDCSQbsQcagkr1TrYxUh2oVzxFIkM0kXhOFGNpbjFIIiJIGKW58ZiAApDYMzsWJVNxMCkZl57FKuWqXBjDxkazm+nnD+QWcbGVXJPsXRFYFyJXvKcRZBAWLFuK5YiYA0zqv9x+tE1q/oWpXj3Spf2ac46F21qnuJEe8+6oeZlkT0i8xCOt5dQogRUEmVcxBZyhJIEeVaNpbjFIISCdqdk5UVwopyyt7+43WiEnFkjg7ADVtUMasuXLSqe4n0H7VRKTvm0w+jxrVoVfcS9e8PaARRo4Q4nUTr432iAinaOLxNlc1UbdGfm8pxGkFRronYHAhngGIMNohdL1lFKG+3QEgu7bp3m2rp+Op9otx2Dr3ltpWuvGbkMtbaU45TiMlNuEgiDGeexxrd203lOIUoM3hqIFvpaTbTFNaecpxFKIrtAj3fk7O7AKiRf6xd1Y1Ezl+5YminzhH0isxDdv7xOhHzV2ECUk72KLu18wGknr9aRIjRP6/WU+iAVfOF0PnHOiIm2O23BZA1jRVug52fL61f5UEONbikaK3keEn7j7eJx/NRcts8ZxQ52lPVA9lUjrMITVPV1TgHwo+kdnq+ZAGR8z6ZlyvrVLaI2KtqtmHRqprwq2baYy4OCNc+Yt4vkeNric8/x4SyDeWgymUTygHWnnIcRoT7UA6Oit6kotg+ZhTXrupCouq7KA/C6R const SITE_DATA = JSON.parse(document.getElementById('siteData').textContent);

const state = {
  view: 'list',
  doku: 0,
  lbIndex: 0,
  lbItems: []
};

function escHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderSiteData(){
  document.getElementById('profile-name').textContent = SITE_DATA.profile.name;
  document.getElementById('profile-bio').innerHTML = SITE_DATA.profile.bioHtml;

  document.getElementById('list-view').innerHTML = SITE_DATA.posts.map((p, index) => `
    <article class="post" data-doku="${p.doku}" data-post-index="${index}">
      <div class="post-header">
        <div class="post-avatar">👩</div>
        <div class="post-meta">
          <div class="post-name">${escHtml(p.name)}
            <span class="doku-badge" style="color:${escHtml(p.badgeColor)};border-color:${escHtml(p.badgeColor)};">${escHtml(p.badge)}</span>
          </div>
          <div class="post-date">${escHtml(p.date)}</div>
          <div class="post-location">📍 <em>${escHtml(p.location)}</em></div>
        </div>
      </div>
      <img class="post-img" src="${p.image}" alt="${escHtml(p.location)}の投稿画像" loading="lazy" draggable="false">
      <div class="post-serif">${escHtml(p.serif)}</div>
      <div class="post-body">
        <div class="post-text">${escHtml(p.text)}</div>
        <div class="post-tags">${p.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>
      </div>
      <div class="post-footer">${p.reactions.map(r => `<span class="reaction">${escHtml(r)}</span>`).join('')}</div>
    </article>
  `).join('');

  document.getElementById('tile-view').innerHTML = SITE_DATA.posts
    .map((p, index) => ({p, index}))
    .filter(x => x.p.tile?.enabled)
    .map(({p, index}) => `
      <div class="tile" data-doku="${p.doku}" data-post-index="${index}" tabindex="0" role="button" aria-label="${escHtml(p.serif)}">
        <img class="tile-img" src="${p.image}" alt="${escHtml(p.location)}の投稿画像" loading="lazy" draggable="false">
        <div class="tile-overlay">
          <div class="tile-serif">${escHtml(p.serif)}</div>
          <div class="tile-loc">${escHtml(p.tile.loc || p.location)}</div>
          <div class="tile-stars">${escHtml(p.tile.stars || p.badge)}</div>
        </div>
      </div>
    `).join('');
}

function visiblePosts(){
  return SITE_DATA.posts
    .map((p, index) => ({...p, index}))
    .filter(p => state.doku === 0 || p.doku === state.doku);
}

function collectItems(){
  state.lbItems = visiblePosts().map(p => ({
    postIndex: p.index,
    src: p.image,
    serif: p.serif,
    loc: p.location,
    date: p.date,
    doku: p.badge,
    dokuColor: p.badgeColor,
    text: p.text,
    tags: p.tags,
    reactions: p.reactions
  }));
}

function openLBByPostIndex(postIndex){
  collectItems();
  const idx = state.lbItems.findIndex(x => x.postIndex === postIndex);
  if(idx < 0) return;
  state.lbIndex = idx;
  updateLB();
  document.getElementById('lightbox').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function updateLB(){
  const item = state.lbItems[state.lbIndex];
  if(!item) return;

  document.getElementById('lb-date').textContent = item.date;
  document.getElementById('lb-loc').textContent = '📍 ' + item.loc;

  const dokuEl = document.getElementById('lb-doku');
  dokuEl.textContent = item.doku;
  dokuEl.style.color = item.dokuColor;
  dokuEl.style.borderColor = item.dokuColor;

  document.getElementById('lb-img').src = item.src;
  document.getElementById('lb-serif').textContent = item.serif;
  document.getElementById('lb-text').textContent = item.text;
  document.getElementById('lb-tags').innerHTML =
    item.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
  document.getElementById('lb-footer').innerHTML =
    item.reactions.map(r => `<span class="lb-reaction">${escHtml(r)}</span>`).join('');
  document.getElementById('lb-counter').textContent =
    `${state.lbIndex + 1} / ${state.lbItems.length}`;
}

function closeLB(){
  document.getElementById('lightbox').classList.remove('on');
  document.getElementById('lb-img').src = '';
  document.body.style.overflow = '';
}

function lbPrev(){
  if(!state.lbItems.length) return;
  state.lbIndex = (state.lbIndex - 1 + state.lbItems.length) % state.lbItems.length;
  updateLB();
}

function lbNext(){
  if(!state.lbItems.length) return;
  state.lbIndex = (state.lbIndex + 1) % state.lbItems.length;
  updateLB();
}

function setView(view){
  state.view = view;
  document.getElementById('list-view').classList.toggle('off', view !== 'list');
  document.getElementById('tile-view').classList.toggle('on', view === 'tile');
  document.getElementById('btn-list').classList.toggle('on', view === 'list');
  document.getElementById('btn-tile').classList.toggle('on', view === 'tile');

  if(view === 'tile'){
    document.querySelectorAll('.tile.open').forEach(t => t.classList.remove('open'));
  }
}

function filterDoku(level, btn){
  state.doku = level;
  document.querySelectorAll('.df-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  document.querySelectorAll('[data-doku]').forEach(el => {
    el.classList.toggle('hidden', level > 0 && Number(el.dataset.doku) !== level);
  });
}

function toggleTile(tile){
  const open = tile.classList.contains('open');
  document.querySelectorAll('.tile.open').forEach(t => t.classList.remove('open'));
  if(!open) tile.classList.add('open');
}

function initContentEvents(){
  const list = document.getElementById('list-view');
  const tiles = document.getElementById('tile-view');
  let tileTap = {el:null, time:0};
  let tileTimer = null;

  // リスト画像：1本だけのイベント委譲
  list.addEventListener('click', e => {
    const img = e.target.closest('.post-img');
    if(!img) return;
    const post = img.closest('.post');
    openLBByPostIndex(Number(post.dataset.postIndex));
  });

  // タイル：シングルでセリフ、ダブルで該当投稿をライトボックス
  tiles.addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if(!tile) return;

    const now = Date.now();
    const sameTile = tileTap.el === tile;
    const isDouble = sameTile && (now - tileTap.time < 350);
    tileTap = {el:tile, time:now};

    if(isDouble){
      clearTimeout(tileTimer);
      tile.classList.remove('open');
      openLBByPostIndex(Number(tile.dataset.postIndex));
      return;
    }

    clearTimeout(tileTimer);
    tileTimer = setTimeout(() => toggleTile(tile), 360);
  });

  // キーボード操作
  tiles.addEventListener('keydown', e => {
    const tile = e.target.closest('.tile');
    if(!tile) return;
    if(e.key === 'Enter'){
      openLBByPostIndex(Number(tile.dataset.postIndex));
    }else if(e.key === ' '){
      e.preventDefault();
      toggleTile(tile);
    }
  });

  // 右クリック禁止は親で一括
  document.addEventListener('contextmenu', e => {
    if(e.target.closest('.post-img,.tile-img,#lb-img')) e.preventDefault();
  });
}

function initLightboxEvents(){
  const lb = document.getElementById('lightbox');
  let swipeStartX = 0;

  lb.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
  }, {passive:true});

  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeStartX;
    if(Math.abs(dx) > 50) dx < 0 ? lbNext() : lbPrev();
  });

  document.addEventListener('keydown', e => {
    if(!lb.classList.contains('on')) return;
    if(e.key === 'ArrowLeft') lbPrev();
    if(e.key === 'ArrowRight') lbNext();
    if(e.key === 'Escape') closeLB();
  });
}

function initTheme(){
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');

  if(localStorage.getItem('k_daily_theme') === 'dark'){
    root.classList.add('dark-mode');
  }

  const sync = () => {
    const dark = root.classList.contains('dark-mode');
    btn.textContent = dark ? '☀' : '🌙';
    btn.title = dark ? 'ライトモード切替' : 'ダークモード切替';
    btn.setAttribute('aria-label', btn.title);
  };

  sync();

  btn.addEventListener('click', () => {
    root.classList.toggle('dark-mode');
    localStorage.setItem(
      'k_daily_theme',
      root.classList.contains('dark-mode') ? 'dark' : 'light'
    );
    sync();
  });
}


function initMessage(){
  const message = SITE_DATA.message;
  const btn = document.getElementById('message-btn');
  const modal = document.getElementById('message-modal');
  const closeBtn = document.getElementById('message-close');

  document.getElementById('message-title').textContent = message.title;
  document.getElementById('message-body').innerHTML =
    message.paragraphs.map(p => `<p>${escHtml(p)}</p>`).join('');
  document.getElementById('message-qr-img').src = message.qrDataUri;
  document.getElementById('message-url').textContent = message.url;

  const close = () => {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
  };

  btn.addEventListener('click', () => {
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
  });
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', e => {
    if(e.target === modal) close();
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) close();
  });
}

function initTechInfo(){
  const tech = SITE_DATA.techInfo;
  const btn = document.getElementById('tech-info-btn');
  const modal = document.getElementById('tech-info-modal');
  const closeBtn = document.getElementById('tech-info-close');

  document.getElementById('tech-info-title').textContent = tech.title;
  document.getElementById('tech-info-body').innerHTML = tech.sections.map(sec => `
    <section class="tech-section">
      <h3>${escHtml(sec.heading)}</h3>
      <p>${escHtml(sec.body)}</p>
    </section>
  `).join('');

  const close = () => {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
  };

  btn.addEventListener('click', () => {
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
  });
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', e => {
    if(e.target === modal) close();
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) close();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderSiteData();
  initContentEvents();
  initLightboxEvents();
  initTheme();
  initMessage();
  initTechInfo();
  setView('list');

  document.getElementById('btn-list').addEventListener('click', () => setView('list'));
  document.getElementById('btn-tile').addEventListener('click', () => setView('tile'));

  document.querySelector('.doku-filter').addEventListener('click', e => {
    const btn = e.target.closest('.df-btn');
    if(btn) filterDoku(Number(btn.dataset.level), btn);
  });

  document.getElementById('lb-close').addEventListener('click', closeLB);
  document.getElementById('lb-prev').addEventListener('click', lbPrev);
  document.getElementById('lb-next').addEventListener('click', lbNext);
});
</script>
