:root{color-scheme:light;--bg:#f2e8d5;--panel:#fbf6eb;--text:#3b2e22;--muted:#746853;--line:#d8c9b0;--accent:#627248;--soft:#e8dfcb}html.dark-mode{color-scheme:dark;--bg:#181410;--panel:#2c241c;--text:#efe6d6;--muted:#b8a68e;--line:#4d4034;--accent:#b7cd91;--soft:#382e22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.6}header{border-bottom:1px solid var(--line);padding:20px;display:flex;align-items:center;gap:12px;max-width:980px;margin:auto}.cat{width:34px;height:43px;display:block;flex:none}.cat svg{width:100%;height:100%}.brand{flex:1}.brand strong{display:block;font:700 30px Georgia,serif}.brand small{color:var(--muted);font-size:11px;letter-spacing:.12em}button,a{touch-action:manipulation}button{font:inherit;border:1px solid var(--line);border-radius:24px;background:var(--panel);color:var(--text);padding:10px 17px;cursor:pointer;min-height:44px}.icon{width:44px;padding:6px;font-size:22px}main{max-width:940px;margin:auto;padding:28px 20px 60px}.topline{display:flex;justify-content:space-between;align-items:end;gap:12px}h1{font-family:serif;font-size:27px;margin:0 0 7px}.intro{color:var(--muted);font-size:14px;margin:0}.search{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;padding:14px 16px;margin:25px 0 14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font-size:13px;padding:8px 15px}.filters button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}.summary{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin:22px 0 12px}.summary select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}.list{display:grid;gap:10px}.entry{display:flex;gap:15px;align-items:center;text-decoration:none;color:var(--text);padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:transform .18s,border-color .18s}.entry:hover{transform:translateY(-2px);border-color:var(--accent)}.mark{width:55px;height:64px;border-radius:6px 14px 6px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;border:1px solid currentColor;background:var(--soft);font-size:11px;font-weight:750;letter-spacing:.04em}.mark b{font-size:22px;line-height:1.1}.html{color:#ae7541}.pdf{color:#b96b62}.word{color:#6485b2}.excel{color:#6f9465}.info{min-width:0;flex:1}.filename{font-size:15px;font-weight:650;overflow-wrap:anywhere}.filemeta{font-size:12px;color:var(--muted);margin-top:6px}.arrow{color:var(--accent);font-size:23px}.state{border:1px dashed var(--line);border-radius:12px;padding:35px 20px;text-align:center;color:var(--muted)}.help{margin-top:25px;color:var(--muted);font-size:12px}footer{text-align:center;font-size:11px;color:var(--muted);padding:20px}footer a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}@media(min-width:750px){.list{grid-template-columns:1fr 1fr}}@media(max-width:400px){header{padding:14px}.entry{padding:14px;gap:12px}main{padding:22px 14px}.topline{align-items:center}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){.entry{transition:none}}

      </a><div class="brand"><small>TAKESHI UCHIMI · FILE COLLECTION</small><strong>Box</strong></div><button id="theme" class="icon" aria-label="ダークモードに切替">◐</button></header><main><div class="topline"><div><h1>ファイル棚</h1><p class="intro">資料も、作品も。ここからひとつ。</p></div><button id="refresh">↻ 更新</button></div><nav id="breadcrumbs" class="breadcrumbs" aria-label="現在のフォルダ"></nav><button id="up" hidden>↰ １つ上へ</button><label><span hidden>ファイル名で検索</span><input type="search" class="search" id="search" placeholder="ファイル名で検索" aria-label="ファイル名で検索"></label><div class="filters" id="filters" aria-label="種類で絞り込む"></div><div class="summary"><span id="count" role="status">読み込み中…</span><label>並び順 <select id="sort"><option value="asc">名前 A → Z</option><option value="desc">名前 Z → A</option><option value="type">ファイルの種類</option></select></label></div><div class="list" id="list" aria-busy="true"></div><p class="help">フォルダマークで中へ進み、パンくずや「１つ上へ」で戻れます。検索・絞り込みは現在のフォルダが対象です。HTML・PDFはブラウザで開きます。Word・Excelは、お使いの端末に応じてダウンロードまたは対応アプリで開きます。</p></main><footer><a href="../index.html">Works &amp; Tools に戻る</a></footer><script>
const API='https://api.github.com/repos/takeshiuchimi/takeshiuchimi.github.io/contents/box';
let current=[];function validPath(value){const parts=(value||'').split('/').filter(Boolean);if(parts.some(p=>p==='.'||p==='..'||p.includes('\\')||/[\u0000-\u001f]/.test(p)))return [];return parts}function fromLocation(){current=validPath(new URL(location.href).searchParams.get('folder'));}function folderUrl(parts){const u=new URL(location.href);if(parts.length)u.searchParams.set('folder',parts.join('/'));else u.searchParams.delete('folder');return u}function navigate(parts,push=true){current=parts.slice();if(push)history.pushState(null,'',folderUrl(current));$('search').value='';active='all';load()}function breadcrumbs(){const holder=$('breadcrumbs');holder.replaceChildren();for(let i=0;i<=current.length;i++){if(i){const sep=document.createElement('span');sep.className='sep';sep.textContent='›';holder.append(sep)}const b=document.createElement('button');b.textContent=i?current[i-1]:'Box';if(i===current.length)b.setAttribute('aria-current','page');b.onclick=()=>navigate(current.slice(0,i));holder.append(b)}$('up').hidden=current.length===0;$('up').onclick=()=>navigate(current.slice(0,-1));}
const TYPES={folder:{label:'フォルダ',icon:'📁',extensions:[]},html:{label:'HTML',icon:'〈〉',extensions:['html','htm']},pdf:{label:'PDF',icon:'≡',extensions:['pdf']},word:{label:'WORD',icon:'W',extensions:['doc','docx']},excel:{label:'EXCEL',icon:'X',extensions:['xls','xlsx','xlsm','xlsb','csv']}};
const $=id=>document.getElementById(id);let files=[],active='all',request=0;const collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});
function classify(name){const ext=name.split('.').pop().toLowerCase();return Object.keys(TYPES).find(k=>TYPES[k].extensions.includes(ext))||null}
function normalize(items,path=current){if(!Array.isArray(items))throw Error('一覧の形式が違います');return items.filter(f=>f.name&&!f.name.startsWith('.')&&!f.name.startsWith('~$')&&(f.type==='dir'||(f.type==='file'&&!/^index\.html?$/i.test(f.name)&&classify(f.name)))).map(f=>({name:f.name,type:f.type==='dir'?'folder':classify(f.name),size:Number(f.size)||0,parts:[...path,f.name],url:'./'+[...path,f.name].map(encodeURIComponent).join('/')}))}
function sizeText(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?Math.ceil(n/1024)+' KB':n+' B'}
function filters(){const holder=$('filters');holder.replaceChildren();for(const key of ['all',...Object.keys(TYPES)]){const b=document.createElement('button');b.textContent=(key==='all'?'すべて':TYPES[key].label)+' '+(key==='all'?files.length:files.filter(f=>f.type===key).length);b.setAttribute('aria-pressed',String(active===key));b.onclick=()=>{active=key;filters();render()};holder.append(b)}}
function state(message,retry=false){const el=document.createElement('div');el.className='state';el.textContent=message;if(retry){const b=document.createElement('button');b.textContent='もう一度読み込む';b.onclick=load;el.append(document.createElement('br'),b)}$('list').replaceChildren(el)}
function render(){const query=$('search').value.normalize('NFKC').toLocaleLowerCase('ja');let selected=files.filter(f=>(active==='all'||f.type===active)&&f.name.normalize('NFKC').toLocaleLowerCase('ja').includes(query));const order=$('sort').value;selected.sort((a,b)=>(a.type==='folder'?0:1)-(b.type==='folder'?0:1)||(order==='type'?collator.compare(a.type,b.type)||collator.compare(a.name,b.name):collator.compare(a.name,b.name)*(order==='desc'?-1:1)));$('count').textContent=selected.length+' 件 / このフォルダ '+files.length+' 件';$('list').replaceChildren();if(!selected.length){state(files.length?'該当するファイルがありません。':'このフォルダは空です。資料やフォルダを追加すると、ここに並びます。');return}for(const f of selected){const a=document.createElement(f.type==='folder'?'button':'a');a.className='entry'+(f.type==='folder'?' folder-entry':'');if(f.type==='folder'){a.onclick=()=>navigate(f.parts)}else{a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';}const mark=document.createElement('span');mark.className='mark '+f.type;mark.setAttribute('aria-hidden','true');const symbol=document.createElement('b');symbol.textContent=TYPES[f.type].icon;mark.append(symbol,document.createTextNode(TYPES[f.type].label));const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='filename';name.textContent=f.name;const meta=document.createElement('div');meta.className='filemeta';meta.textContent=f.type==='folder'?'フォルダを開く':f.name.split('.').pop().toUpperCase()+' · '+sizeText(f.size);info.append(name,meta);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent=f.type==='folder'?'›':'↗';a.append(mark,info,arrow);$('list').append(a)}}
async function load(){const token=++request;breadcrumbs();$('refresh').disabled=true;$('list').setAttribute('aria-busy','true');$('count').textContent='読み込み中…';state('ファイルを探しています…');try{const response=await fetch(API+(current.length?'/'+current.map(encodeURIComponent).join('/') : ''),{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!response.ok)throw Error(response.status===404?'フォルダが見つかりません。公開状況を確認するか、１つ上へ戻ってください。':response.status===403||response.status===429?'アクセスが集中しています。少し時間をおいてお試しください。':'一覧を取得できませんでした。');const data=await response.json();if(token!==request)return;files=normalize(data);filters();render()}catch(e){if(token!==request)return;$('count').textContent='読み込みできませんでした';state(e.message==='Failed to fetch'?'通信できませんでした。接続を確認して再読み込みしてください。':e.message,true)}finally{if(token===request){$('refresh').disabled=false;$('list').setAttribute('aria-busy','false')}}}
function theme(dark){document.documentElement.classList.toggle('dark-mode',dark);$('theme').textContent=dark?'☀':'◐';$('theme').setAttribute('aria-label',(dark?'ライト':'ダーク')+'モードに切替');document.querySelector('meta[name="theme-color"]').content=dark?'#181410':'#f2e8d5';try{localStorage.setItem('takeshi_theme',dark?'dark':'light')}catch{}}
let saved;try{saved=localStorage.getItem('takeshi_theme')}catch{}theme(saved==='dark');$('theme').onclick=()=>theme(!document.documentElement.classList.contains('dark-mode'));$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=load;window.addEventListener('popstate',()=>{fromLocation();$('search').value='';active='all';load()});fromLocation();filters();load();
</script></html>
